---

- name: install monit
  yum:
    name: monit
    state: present

- name: monit configured
  template:
    src: monit.j2
    dest: /etc/monitrc
    owner: root
    group: root
    mode: 0600
  notify:
    - restart monit

# FIXME each should belong to its own role
- name: monit snippets installed
  template:
    src: "{{ item }}.j2"
    dest: "/etc/monit.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  with_items:
    - nginx
    - php-fpm
  notify:
    - restart monit

# FIXME each should belong to its own role
- name: more monit snippets installed
  copy:
    src: "{{ item }}"
    dest: "/etc/monit.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  with_items:
    - system
  notify:
    - restart monit

- name: enable monit daemon
  service:
    name: monit
    state: started
    enabled: yes
