---

- name: install monit
  yum:
    name: monit
    state: present

- name: monit configured
  template:
    src: monit.j2
    dest: /etc/monitrc
    owner: root
    group: root
    mode: 0600
  notify:
    - restart monit

- name: enable monit daemon
  service:
    name: monit
    state: started
    enabled: yes
