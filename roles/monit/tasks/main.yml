---

- name: monit installed
  yum:
    name: monit
    state: present

- name: monit configuration installed
  template:
    src: monit.j2
    dest: /etc/monitrc
    owner: root
    group: root
    mode: 0600
  notify:
    - restart monit

- name: monit started and enabled at boot
  service:
    name: monit
    state: started
    enabled: yes
