---

- name: monit installed
  yum:
    name: monit
    state: present

- name: monit alerting configuration installed
  lineinfile:
    path: /etc/monit.d/monit-alert-email
    regexp: "^#?{{ conf_line }}"
    line: "{{ conf_line }}"
    create: yes
  vars:
    conf_line: "set mailserver localhost"
  notify:
    - reload monit

- name: monit alerting email configuration installed
  lineinfile:
    path: /etc/monit.d/monit-alert-email
    regexp: "^#?set alert {{ item }}"
    line: "{% if not alerting_email_enabled %}#{% endif %}set alert {{ item }}"
    create: yes
  with_items:
    "{{ admins_email_list }}"
  notify:
    - reload monit

- name: monit logs to system
  file:
    path: /etc/monit.d/logging
    state: absent
  notify:
    - reload monit

- name: monit system snippet installed
  template:
    src: monit-snippet-system.j2
    dest: /etc/monit.d/system
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit

- name: monit started and enabled at boot
  service:
    name: monit
    state: started
    enabled: yes
