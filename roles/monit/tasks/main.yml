---

- name: install monit
  yum:
    name: monit
    state: present

- name: configure monit (1)
  template:
    src: monit.j2
    dest: /etc/monitrc
    owner: root
    group: root
    mode: 0600
  notify:
    - restart monit

- name: configure monit (2)
  template:
    src: "{{ item }}.j2"
    dest: "/etc/monit.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  with_items:
    - mysqld
    - nginx
    - php-fpm
  notify:
    - restart monit

- name: configure monit (3)
  copy:
    src: "{{ item }}"
    dest: "/etc/monit.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  with_items:
    - system
  notify:
    - restart monit

- name: enable monit daemon
  service:
    name: monit
    state: started
    enabled: yes
