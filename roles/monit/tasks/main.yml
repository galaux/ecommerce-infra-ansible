---

- name: monit installed
  yum:
    name: monit
    state: present

- name: monit configuration installed
  lineinfile:
    path: /etc/monit.d/monit-alert-email
    regexp: "^#?set alert {{ item }}"
    line: "{% if not is_prod %}#{% endif %}set alert {{ item }}"
    create: yes
  with_items:
    "{{ admins_email_list }}"
  notify:
    - reload monit

- name: monit logs to system
  file:
    path: /etc/monit.d/logging
    state: absent
  notify:
    - reload monit

- name: monit started and enabled at boot
  service:
    name: monit
    state: started
    enabled: yes
