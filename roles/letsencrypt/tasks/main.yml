---

- name: certbot installed
  pip:
    virtualenv: "{{ virtualenv_path }}/certbot"
    name: >
      certbot,
      certbot-nginx,
      certbot-dns-route53

- name: certbot link available
  file:
    src: "{{ virtualenv_path }}/certbot/bin/certbot"
    dest: /usr/local/bin/certbot
    state: link

- name: state whether certificates are already present
  command: test -d "{{ letsencrypt_path }}"
  check_mode: no
  register: letsencrypt_already_present
  failed_when: letsencrypt_already_present.rc > 1

- name: certificates backup available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ certificates_backup_name }}"
    dest: "/tmp/{{ certificates_backup_name }}"
    mode: get
  when: letsencrypt_already_present.rc == 1

- name: certificates installed
  unarchive:
    src: /tmp/cert-{{ main_domain_name }}.tgz
    dest: /etc
    remote_src: yes
    creates: "{{ letsencrypt_path }}"
  when: letsencrypt_already_present.rc == 1

- name: files and directories owner/group set
  file:
    path: "{{ backup_data_snippet_dir }}"
    owner: root
    group: root
    mode: 0755
    state: directory
    recurse: yes

- name: data backup snippet installed
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/certificates"
    owner: root
    group: root
    mode: 0755

- name: certificates renewal service installed
  copy:
    src: renew-certificates.service
    dest: /etc/systemd/system/renew-certificates.service
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload


# Test config only

- name: test instance only - certificates renewal enabled at boot
  service:
    name: renew-certificates.service
    enabled: yes
  when: not is_prod

- name: test instance only - certificates renewal timer disabled
  file:
    path: /etc/systemd/system/renew-certificates.timer
    state: absent
  notify:
    - daemon reload
  when: not is_prod


# Production config only

- name: production instance only - certificates renewal disabled at boot
  service:
    name: renew-certificates.service
    enabled: no
  when: is_prod

- name: production instance only - certificates renewal timer enabled
  copy:
    src: renew-certificates.timer
    dest: /etc/systemd/system/renew-certificates.timer
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload
  when: is_prod

