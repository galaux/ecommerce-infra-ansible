---

- name: install certbot
  yum:
    name: >
      certbot,
      python2-certbot-nginx

# - name: install certbot dependencies
#   shell: >
#     unset $PYTHON_INSTALL_LAYOUT && \
#     /usr/local/bin/certbot-auto \
#       --debug \
#       --non-interactive \
#       --version

- name: stat whether certificates are already present
  command: test -d "{{ letsencrypt_path }}"
  check_mode: no
  register: letsencrypt_already_present
  failed_when: letsencrypt_already_present.rc > 1

- name: retrieve backup certificates from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ certificates_backup_name }}"
    dest: "/tmp/{{ certificates_backup_name }}"
    mode: get
  when: letsencrypt_already_present.rc == 1

- name: deploy certificates
  unarchive:
    src: /tmp/cert-{{ main_domain_name }}.tgz
    dest: /etc
    remote_src: yes
    creates: "{{ letsencrypt_path }}"
  when: letsencrypt_already_present.rc == 1


- name: set data backup snippet
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/certificates"
    owner: root
    group: root
    mode: 0755

- name: install certificates renewal service
  copy:
    src: renew-certificates.service
    dest: /etc/systemd/system/renew-certificates.service
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload


# Production only config

- name: production instance only - install timer to renew certificates
  copy:
    src: renew-certificates.timer
    dest: /etc/systemd/system/renew-certificates.timer
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload
  when: is_prod

- name: production instance only - disable certificates renewal at boot
  service:
    name: renew-certificates
    enabled: no
  when: is_prod


# Test only config

- name: test instance only - remove any timer to renew certificates
  file:
    path: /etc/systemd/system/renew-certificates.timer
    state: absent
  notify:
    - daemon reload
  when: not is_prod

- name: test instance only - enable certificates renewal at boot
  service:
    name: renew-certificates
    enabled: yes
  when: not is_prod
