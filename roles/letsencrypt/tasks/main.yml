---

- name: install certbot
  get_url:
    url: https://dl.eff.org/certbot-auto
    dest: /usr/local/bin/certbot-auto
    checksum: sha256:687987829ad4676aa2ad2beae7482a0ae08cdbb865300f5e4ee17f4a98620847
    owner: root
    group: root
    mode: 0775

- name: stat whether certificates are already present
  command: test -d "{{ letsencrypt_path }}"
  register: letsencrypt_already_present
  failed_when: letsencrypt_already_present.rc > 1

- name: retrieve backup certificates from S3
  aws_s3:
    # TODO make retrieval of PROD certificate work
    bucket: prestashop-data
    object: /cert-{{ fqdn }}.tgz
    dest: /tmp/cert-{{ fqdn }}.tgz
    mode: get
  when: letsencrypt_already_present.rc == 1

- name: deploy certificates
  unarchive:
    src: /tmp/cert-{{ fqdn }}.tgz
    # TODO make backup script archive relative path for letsencrypt and set it here from variable
    dest: /etc
    remote_src: yes
    creates: "{{ letsencrypt_path }}"
  when: letsencrypt_already_present.rc == 1

- name: setup cron to update letsencrypt certificates
  template: >
   src=cron.j2
   dest=/etc/cron.d/renew-certificates
   owner=root
   group=root
   mode=0644
  notify:
    - reload crond
