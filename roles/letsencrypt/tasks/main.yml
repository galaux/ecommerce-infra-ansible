---

- name: install certbot
  yum:
    name: >
      certbot,
      python2-certbot-nginx

# - name: install certbot dependencies
#   shell: >
#     unset $PYTHON_INSTALL_LAYOUT && \
#     /usr/local/bin/certbot-auto \
#       --debug \
#       --non-interactive \
#       --version

- name: stat whether certificates are already present
  command: test -d "{{ letsencrypt_path }}"
  check_mode: no
  register: letsencrypt_already_present
  failed_when: letsencrypt_already_present.rc > 1

- name: retrieve backup certificates from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ certificates_backup_name }}"
    dest: "/tmp/{{ certificates_backup_name }}"
    mode: get
  when: letsencrypt_already_present.rc == 1

- name: deploy certificates
  unarchive:
    src: /tmp/cert-{{ main_domain_name }}.tgz
    dest: /etc
    remote_src: yes
    creates: "{{ letsencrypt_path }}"
  when: letsencrypt_already_present.rc == 1

# We setup cron to update the certificates regardless of create_backups
# If create_backups=True then this instance is a "soon to become" production.
# Renewing certificates will fail as production DNS do not point at it
# but chances are this instance will shortly replace the real production.
# Doing so prevent forgetting to re-enable renewal of certificates at low cost.
- name: production instance only - install cron to renew certificates
  copy:
    src: renew-certificates.cron
    dest: /etc/cron.d/renew-certificates
    owner: root
    group: root
    mode: 0644
  notify:
    - reload crond
  when: is_prod

- name: set data backup snippet
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/certificates"
    owner: root
    group: root
    mode: 0755

