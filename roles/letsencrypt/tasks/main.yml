---

- name: install certbot
  yum:
    name: >
      certbot,
      python2-certbot-nginx

# - name: install certbot dependencies
#   shell: >
#     unset $PYTHON_INSTALL_LAYOUT && \
#     /usr/local/bin/certbot-auto \
#       --debug \
#       --non-interactive \
#       --version

- name: stat whether certificates are already present
  command: test -d "{{ letsencrypt_path }}"
  check_mode: no
  register: letsencrypt_already_present
  failed_when: letsencrypt_already_present.rc > 1

- name: retrieve backup certificates from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ certificates_backup_name }}"
    dest: "/tmp/{{ certificates_backup_name }}"
    mode: get
  when: letsencrypt_already_present.rc == 1

- name: deploy certificates
  unarchive:
    src: /tmp/cert-{{ main_domain_name }}.tgz
    dest: /etc
    remote_src: yes
    creates: "{{ letsencrypt_path }}"
  when: letsencrypt_already_present.rc == 1

- name: install script to renew and backup certificates
  template:
    src: renew-and-backup-certificates.sh.j2
    dest: /usr/local/bin/renew-and-backup-certificates
    owner: root
    group: root
    mode: 0775

- name: production instance only - install cron to renew and backup certificates
  copy:
    src: renew-and-backup-certificates.cron
    dest: /etc/cron.d/renew-and-backup-certificates
    owner: root
    group: root
    mode: 0644
  notify:
    - reload crond
  when: is_prod and create_backups

- name: test instance only - install Systemd service to renew and backup certificates at boot
  copy:
    src: renew-and-backup-certificates.service
    dest: /etc/systemd/system/renew-and-backup-certificates.service
    owner: root
    group: root
    mode: 0644
  when: not is_prod

- name: test instance only - enable Systemd service to renew and backup certificates at boot
  service:
    name: renew-and-backup-certificates.service
    enabled: yes
  when: not is_prod

