---

- name: get SELinux state
  shell: /sbin/getenforce
  register: selinux_state
  check_mode: no

- name: SELinux current state set to permissive mode
  shell: /sbin/setenforce permissive
  when: selinux_state.stdout == 'Enforcing'

- name: SELinux set to permissive mode for next reboots
  lineinfile:
    path: /etc/selinux/config
    regexp: "^#?SELINUX="
    line: "SELINUX=permissive"

# boto3 required for Ansible module aws_s3
# passlib required for Ansible module htpasswd
- name: base packages are installed
  yum:
    name: >
      bzip2,
      htop,
      patch,
      python-boto3,
      python-passlib,
      tree,
      unzip,
      vim-enhanced
    state: present

# https://bugs.centos.org/view.php?id=14771
# TODO: remove `patch` from dependencies when removing this
- name: missing import in python-boto3 file present
  patch:
    basedir: /
    src: python-boto3-add-sys-import.patch

# Dirty awscli install to circumvent its python dependency mess in CentOS
- name: pip installed
  yum:
    name: python2-pip
    state: present

- name: awscli installed
  command: /bin/pip install awscli

- name: hostname set
  command: /usr/bin/hostnamectl set-hostname "{{ main_domain_name }}"
  check_mode: no

- name: DNS record update script installed
  copy:
    src: update-dns-record
    dest: /usr/local/bin/update-dns-record
    owner: root
    group: root
    mode: 0755

- name: instance DNS records update script installed
  template:
    src: update-instance-dns-records.j2
    dest: /usr/local/bin/update-instance-dns-records
    owner: root
    group: root
    mode: 0755

- name: DNS Systemd service installed
  copy:
    src: update-instance-dns-records.service
    dest: /etc/systemd/system/update-instance-dns-records.service
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload

- name: hosts file configured
  template:
    src: etc-hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: 0644

- name: script to open/close shop installed
  template:
    src: prestashop-status.sh.j2
    dest: /usr/local/bin/prestashop-status
    owner: root
    group: root
    mode: 0755

- name: compression for logrotate set
  lineinfile:
    path: /etc/logrotate.conf
    regexp: "^#?compress"
    line: "compress"

- name: Bash configured for Unix users
  template:
    src: bashrc.j2
    dest: "{{ item.dest_dir }}/.bashrc"
    owner: "{{ item.ownergp }}"
    group: "{{ item.ownergp }}"
    mode: 0644
  vars:
    user_color: "{{ item.user_color }}"
    hostname_color: "{% if is_prod %}DARK_RED{% else %}DARK_YELLOW{% endif %}"
  with_items:
    - { dest_dir: "/root",                    ownergp: "root",               user_color: "DARK_RED" }
    - { dest_dir: "/home/{{ regular_user }}", ownergp: "{{ regular_user }}", user_color: "DARK_GREY" }

- name: iptables backup file available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: /iptables-save.log
    dest: /tmp/iptables-save.log
    mode: get

- name: banned IPs configured
  command: iptables-restore /tmp/iptables-save.log

- name: monit snippet installed
  template:
    src: monit.j2
    dest: /etc/monit.d/system
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit


# Test config only

- name: test instance only - DNS update enabled at boot
  service:
    name: update-instance-dns-records
    enabled: true
  when: not is_prod

- name: test instance only - instance DNS records updated
  command: /usr/local/bin/update-instance-dns-records
  when: not is_prod


# Production config only

- name: production instance only - DNS update disabled at boot
  service:
    name: update-instance-dns-records
    enabled: false
  when: is_prod

- name: production instance only - backup snippet installed
  copy:
    src: backup-instance-banned-ips.sh
    dest: /etc/backup-instance.d/banned-ips
    owner: root
    group: root
    mode: 0755
  when: is_prod

