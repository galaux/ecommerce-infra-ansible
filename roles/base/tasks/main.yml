---

- name: configure hosts file
  template:
    src: etc-hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: 0644

- name: set compression for logrotate
  lineinfile:
    path: /etc/logrotate.conf
    regexp: "^#compress"
    line: "compress"

- name: configure Bash for root
  template:
    src: bashrc_root.j2
    dest: /root/.bashrc
    owner: root
    group: root
    mode: 0644

- name: configure Bash for regular user
  template:
    src: bashrc_regular.j2
    dest: "/home/{{ regular_user }}/.bashrc"
    owner: "{{ regular_user }}"
    group: "{{ regular_user }}"
    mode: 0644
