---

- name: get SELinux state
  shell: /sbin/getenforce
  register: selinux_state
  check_mode: no

- name: set SELinux current state to permissive mode
  shell: /sbin/setenforce permissive
  when: selinux_state.stdout == 'Enforcing'

- name: set SELinux next reboot state to permissive mode
  lineinfile:
    backrefs: yes
    path: /etc/selinux/config
    regexp: "^SELINUX=enforcing"
    line: "SELINUX=permissive"

- name: install dependencies
  yum:
    name: >
      awscli,
      bzip2,
      htop,
      python2-boto3,
      tree,
      unzip,
      vim-enhanced
    state: present

- name: get 'latest' backup file from S3 backup
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/latest"
    dest: "/tmp/latest"
    mode: get

- name: read 'latest' backup date from S3 backup if backup_date is missing
  command: cat /tmp/latest
  check_mode: no
  register: last_backup_date

- name: register backup_date if missing
  set_fact:
    backup_date: "{{ last_backup_date.stdout }}"
  when: with_backup_date == 'LATEST'

- name: register backup_date if missing 2
  set_fact:
    backup_date: "{{ with_backup_date }}"
  check_mode: no
  when: with_backup_date != 'LATEST'

- name: show backup_date
  debug:
    msg: "Using backup_date: {{ backup_date }}"

- name: configure hosts file
  template:
    src: etc-hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: 0644

- name: set compression for logrotate
  lineinfile:
    backrefs: yes
    path: /etc/logrotate.conf
    regexp: "^#compress"
    line: "compress"

- name: configure Bash for root
  template:
    src: bashrc.j2
    dest: "{{ item.dest_dir }}/.bashrc"
    owner: "{{ item.ownergp }}"
    group: "{{ item.ownergp }}"
    mode: 0644
  vars:
    is_root: "{{ item.is_root }}"
  with_items:
    - { dest_dir: "/root",                    ownergp: "root",               is_root: true }
    - { dest_dir: "/home/{{ regular_user }}", ownergp: "{{ regular_user }}", is_root: false }
