---

- name: get SELinux state
  shell: /sbin/getenforce
  register: selinux_state
  check_mode: no

- name: set SELinux current state to permissive mode
  shell: /sbin/setenforce permissive
  when: selinux_state.stdout == 'Enforcing'

- name: set SELinux next reboot state to permissive mode
  lineinfile:
    backrefs: yes
    path: /etc/selinux/config
    regexp: "^SELINUX=enforcing"
    line: "SELINUX=permissive"

- name: install dependencies
  yum:
    name: >
      bzip2,
      htop,
      patch,
      python-boto3,
      tree,
      unzip,
      vim-enhanced
    state: present

# https://bugs.centos.org/view.php?id=14771
# TODO: remove `patch` from dependencies when removing this
- name: add missing import in python-boto3
  patch:
    basedir: /
    src: python-boto3-add-sys-import.patch

# Dirty awscli install to circumvent its python dependency mess in CentOS
- name: install pip
  yum:
    name: python2-pip
    state: present

- name: install awscli
  command: /bin/pip install awscli

- name: set hostname
  command: /usr/bin/hostnamectl set-hostname "{{ main_domain_name }}"
  check_mode: no

- name: install DNS update script 1
  copy:
    src: update-dns-record
    dest: /usr/local/bin/update-dns-record
    owner: root
    group: root
    mode: 0755
  when: not is_prod

- name: install DNS update script 2
  template:
    src: update-instance-dns-records.j2
    dest: /usr/local/bin/update-instance-dns-records
    owner: root
    group: root
    mode: 0755
  when: not is_prod

- name: install DNS update script Systemd service
  copy:
    src: update-instance-dns-records.service
    dest: /etc/systemd/system/update-instance-dns-records.service
    owner: root
    group: root
    mode: 0644
  when: not is_prod

- name: enable DNS update script Systemd service at boot
  service:
    name: update-instance-dns-records
    enabled: yes
  when: not is_prod

- name: update instance DNS records
  command: /usr/local/bin/update-instance-dns-records
  when: not is_prod

- name: configure hosts file
  template:
    src: etc-hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: 0644

- name: set compression for logrotate
  lineinfile:
    backrefs: yes
    path: /etc/logrotate.conf
    regexp: "^#compress"
    line: "compress"

- name: install drop-data script
  template:
    src: drop-data.sh.j2
    dest: /usr/local/bin/drop-data
    owner: root
    group: root
    mode: 0755

- name: configure Bash for root
  template:
    src: bashrc.j2
    dest: "{{ item.dest_dir }}/.bashrc"
    owner: "{{ item.ownergp }}"
    group: "{{ item.ownergp }}"
    mode: 0644
  vars:
    is_root: "{{ item.is_root }}"
  with_items:
    - { dest_dir: "/root",                    ownergp: "root",               is_root: true }
    - { dest_dir: "/home/{{ regular_user }}", ownergp: "{{ regular_user }}", is_root: false }
