---

- name: configure hosts file
  template:
    src: etc-hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: 0644

- name: configure Bash for root
  template:
    src: bashrc_root.j2
    dest: /root/.bashrc
    owner: root
    group: root
    mode: 0644

- name: configure Bash for regular user
  template:
    src: bashrc_regular.j2
    dest: /home/ec2-user/.bashrc
    owner: ec2-user
    group: ec2-user
    mode: 0644
