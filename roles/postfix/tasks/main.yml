---

- name: postfix installed
  yum:
    name: postfix
    state: present

- name: postfix configured
  lineinfile:
    path: /etc/postfix/main.cf
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} = {{ item.value }}"
  with_items:
    - { key: "mydomain",                value: "{{ main_domain_name }}" }
    - { key: "virtual_alias_maps",      value: "hash:/etc/postfix/virtual" }
    - { key: "inet_interfaces",         value: "all" }
    - { key: "inet_protocols",          value: "ipv4" }
  notify:
    - reload postfix

- name: email redirections configured
  lineinfile:
    path: /etc/postfix/virtual
    regexp: "^#?{{ item.key }}@{{ main_domain_name }}"
    line: "{{ item.key }}@{{ main_domain_name }} {{ item.value }}"
  with_items:
    - { key: "contact",    value: "owner@example.com" }
    - { key: "galaux",     value: "guillaume@alaux.net" }
    - { key: "guillaume",  value: "owner@example.com" }
    - { key: "postmaster", value: "owner@example.com" }
    - { key: "root",       value: "owner@example.com,guillaume@alaux.net" }
    - { key: "",           value: "owner@example.com.guillaume@alaux.net" } # Catch-all
  notify:
    - update postfix lookup table
    - reload postfix

- name: Systemd sendmail script installed
  copy:
    src: systemd-email.sh
    dest: /usr/local/bin/systemd-email
    owner: root
    group: root
    mode: 0755

- name: Systemd sendmail service installed
  template:
    src: status-email-user@.service.j2
    dest: /etc/systemd/system/status-email-user@.service
    owner: root
    group: root
    mode: 0644
  vars:
    to_addresses: "owner@example.com,guillaume@alaux.net"
  notify:
    - daemon reload

- name: postfix started and enabled at boot
  service:
    name: postfix
    state: started
    enabled: yes
