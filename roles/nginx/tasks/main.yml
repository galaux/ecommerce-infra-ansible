---

- name: install nginx
  yum: >
    name=nginx
    state=present

- name: configure nginx
  template: >
   src=nginx.conf.j2
   dest=/etc/nginx/nginx.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

- name: configure virtual env
  template: >
   src=virtual.conf.j2
   dest=/etc/nginx/conf.d/virtual.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

- name: start and enable nginx
  service: >
    name=nginx
    enabled=yes
    state=started
