---

- name: nginx installed
  yum:
    name: nginx
    state: present

# PS 1.6
# See "Complete example configuration for nginx" from:
# http://doc.prestashop.com/display/PS16/System+Administrator+Guide#SystemAdministratorGuide-NginxfriendlyURLs
# Watch-out, it lacks some security redirects, see
# - 20bf620be67b120ddd969698a2f8072a5111c289 from this repository
# - next link for PS 1.7 that has these redirects
#
# PS 1.7
# https://devdocs.prestashop.com/1.7/basics/installation/nginx/
- name: main nginx configuration file installed
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: nginx SSL configuration file installed
  template:
    src: ssl.conf.j2
    dest: /etc/nginx/default.d/ssl.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: virtual hosts configuration files installed
  template:
    src: "{{ item }}.j2"
    dest: /etc/nginx/conf.d/{{ item }}
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  with_items:
    - local.conf
    - local.conf-status
    - www.conf
    - admin.conf
    - blog.conf

# Crypt scheme set to plain text in order to store password encrypted
- name: htpasswd file installed
  htpasswd:
    path: "{{ htpasswd_path }}"
    name: postmaster
    password: '$apr1$XXXXXXXX'
    crypt_scheme: plaintext
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: nginx and enabled
  service:
    name: nginx
    enabled: yes

