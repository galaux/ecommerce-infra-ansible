---

- name: nginx installed
  yum:
    name: nginx
    state: present

# PS 1.6
# See "Complete example configuration for nginx" from:
# http://doc.prestashop.com/display/PS16/System+Administrator+Guide#SystemAdministratorGuide-NginxfriendlyURLs
# Watch-out, it lacks some security redirects, see
# - 20bf620be67b120ddd969698a2f8072a5111c289 from this repository
# - next link for PS 1.7 that has these redirects
#
# PS 1.7
# https://devdocs.prestashop.com/1.7/basics/installation/nginx/
- name: main nginx configuration file installed
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: virtual hosts configuration files installed
  template:
    src: "{{ item }}.j2"
    dest: /etc/nginx/conf.d/{{ item }}
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  with_items:
    - local.conf
    - local.conf-status
    - www.conf
    - admin.conf
    - blog.conf

- name: htpasswd file installed
  htpasswd:
    path: "{{ htpasswd_path }}"
    name: "{{ web_user }}"
    password: "{{ web_password }}"
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: nginx service enabled
  service:
    name: nginx
    enabled: yes

- name: nginx monit snippet installed
  template:
    src: monit.j2
    dest: /etc/monit.d/nginx
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit


- name: nginx collectd package installed
  yum:
    name: collectd-nginx
    state: present

- name: collectd snippet installed
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.d/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

