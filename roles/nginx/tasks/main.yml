---

- name: nginx installed
  yum:
    name: nginx
    state: present

# http://doc.prestashop.com/display/PS16/System+Administrator+Guide#SystemAdministratorGuide-NginxfriendlyURLs
# https://github.com/PrestaShop/PrestaShop/blob/develop/docs/server_config/nginx.conf.dist
- name: main nginx configuration file installed
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: nginx SSL configuration file installed
  template:
    src: ssl.conf.j2
    dest: /etc/nginx/default.d/ssl.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: virtual hosts configuration files installed
  template:
    src: "{{ item }}.j2"
    dest: /etc/nginx/conf.d/{{ item }}
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  with_items:
    - local.conf
    - local.conf-status
    - www.conf
    - admin.conf
    - blog.conf

# TODO use Ansible `htpasswd` here
- name: htpasswd file installed
  template:
    src: htpasswd.j2
    dest: "{{ htpasswd_path }}"
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: nginx started and enabled
  service:
    name: nginx
    state: started
    enabled: yes

- name: nginx monit snippet installed
  template:
    src: monit.j2
    dest: /etc/monit.d/nginx
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit

- name: collectd snippet installed
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.d/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

