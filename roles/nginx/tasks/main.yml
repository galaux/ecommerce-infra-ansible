---

- name: install nginx
  yum: >
    name=nginx
    state=present

- name: remove package configuration
  file:
    path: /etc/nginx/conf.d/virtual.conf
    state: absent

# http://doc.prestashop.com/display/PS16/System+Administrator+Guide#SystemAdministratorGuide-NginxfriendlyURLs
# https://github.com/PrestaShop/PrestaShop/blob/develop/docs/server_config/nginx.conf.dist
- name: configure nginx
  template: >
   src=nginx.conf.j2
   dest=/etc/nginx/nginx.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

- name: configure status
  template: >
   src=status.conf.j2
   dest=/etc/nginx/conf.d/status.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

- name: install htpasswd
  template: >
   src=htpasswd.j2
   dest=/etc/nginx/htpasswd
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

- name: enable nginx
  service: >
    name=nginx
    enabled=yes
