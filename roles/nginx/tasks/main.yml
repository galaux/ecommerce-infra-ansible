---

- name: install nginx
  yum:
    name: nginx
    state: present

# http://doc.prestashop.com/display/PS16/System+Administrator+Guide#SystemAdministratorGuide-NginxfriendlyURLs
# https://github.com/PrestaShop/PrestaShop/blob/develop/docs/server_config/nginx.conf.dist
- name: configure nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: configure nginx SSL
  template:
    src: ssl.conf.j2
    dest: /etc/nginx/default.d/ssl.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: configure virtual hosts
  template:
    src: "{{ item }}.j2"
    dest: /etc/nginx/conf.d/{{ item }}
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  with_items:
    - local.conf
    - local.conf-status
    - www.conf
    - admin.conf
    - blog.conf

# TODO use Ansible `htpasswd` here
- name: install htpasswd
  template:
    src: htpasswd.j2
    dest: "{{ htpasswd_path }}"
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: enable nginx
  service:
    name: nginx
    state: started
    enabled: yes
