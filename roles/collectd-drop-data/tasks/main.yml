---

- name: monit and collectd are stopped and disabled at boot
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  with_items:
    - monit
    - collectd

- name: remove Collectd data directory
  file:
    state: absent
    path: "{{ collectd_var_path }}"

- name: recreate Collectd data directory
  file:
    state: directory
    path: "{{ collectd_var_path }}"
    owner: root
    group: root
    mode: 0755

