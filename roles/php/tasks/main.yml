---

- name: install PHP repository
  yum:
    name: http://rpms.remirepo.net/enterprise/remi-release-7.rpm
    state: present

- name: enable PHP 7.1 repo
  shell: yum-config-manager --assumeyes --enable remi-php71

- name: install PHP
  yum:
    name: >
      php,
      php-gd,
      php-mbstring,
      php-mcrypt,
      php-mysqlnd,
      php-soap,
      php-xml
    state: present

- name: configure PHP
  ini_file:
    path: /etc/php.ini
    section: Date
    option: date.timezone
    value: '"Europe/Paris"'
  notify:
    - restart php-fpm
