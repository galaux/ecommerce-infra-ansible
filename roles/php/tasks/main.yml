---

- name: PHP RPM repository installed
  yum:
    name: http://rpms.remirepo.net/enterprise/remi-release-7.rpm
    state: present

- name: PHP 5.6 RPM repository disabled
  shell: yum-config-manager --assumeyes --disable remi-php56

- name: PHP 7.1 RPM repository enabled
  shell: yum-config-manager --assumeyes --enable remi-php71

- name: PHP installed
  yum:
    name: >
      php,
      php-gd,
      php-mbstring,
      php-mcrypt,
      php-mysqlnd,
      php-soap,
      php-xml
    state: present

- name: PHP configured
  ini_file:
    path: /etc/php.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "PHP", option: "max_input_vars", value: '2000' }
    - { section: "Date", option: "date.timezone", value: '"Europe/Paris"' }
  notify:
    - restart php-fpm
