---

- name: install PHP
  yum: >
    name={{ item }}
    state=present
  with_items:
    - php56
    - php56-gd
    - php56-mbstring
    - php56-mcrypt
    - php56-mysqlnd
    - php56-soap

# Do not use a remote "copy of /etc/php-5.6.ini" with an Ansible `lineinfile`
# because Ansible would consider the file as changed and thus restart php-fpm
- name: configure PHP
  copy:
    src: php-5.6.ini
    dest: /etc/php-5.6.conf/php.ini
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm
