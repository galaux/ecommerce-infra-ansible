---

- name: install PHP
  yum:
    name: >
      php,
      php-gd,
      php-mbstring,
      php-mcrypt,
      php-mysqlnd,
      php-soap
    state: present

- name: configure PHP
  ini_file:
    path: /etc/php.ini
    section: Date
    option: date.timezone
    value: '"Europe/Paris"'
  notify:
    - restart php-fpm
