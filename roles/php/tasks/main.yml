---

- name: install PHP
  yum: >
    name={{ item }}
    state=present
  with_items:
    - php56
    - php56-gd
    - php56-mbstring
    - php56-mcrypt
    - php56-mysqlnd
    - php56-soap

- name: configure PHP
  template: >
   src=timezone.ini.j2
   dest=/etc/php-5.6.d/20-timezone.ini
   owner=root
   group=root
   mode=0644
