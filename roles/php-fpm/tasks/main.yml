---

- name: install php-fpm
  yum:
    name: php-fpm
    state: present

- name: configure php-fpm
  template:
    src: php-fpm.conf.j2
    dest: /etc/nginx/conf.d/php-fpm.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: configure php-fpm pool
  template:
    src: www.conf.j2
    dest: /etc/php-fpm.d/www.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm

- name: add configuration for PHP applications
  copy:
    src: php.conf
    dest: /etc/nginx/default.d/php.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: configure php-fpm status page in Nginx
  template:
    src: vhost-nginx.conf.j2
    dest: /etc/nginx/conf.d/local.conf-php-fpm
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm

- name: enable php-fpm
  service:
    name: php-fpm
    state: started
    enabled: yes
