---

- name: php-fpm installed
  yum:
    name: php-fpm
    state: present

- name: php-fpm configuration file installed
  ini_file:
    path: /etc/php-fpm.conf
    section: "global"
    option: "pid"
    value: "{{ php_fpm_pid_path }}"

- name: php-fpm nginx configuration file installed
  template:
    src: php-fpm.conf.j2
    dest: /etc/nginx/conf.d/php-fpm.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: php-fpm pool configured
  lineinfile:
    path: /etc/php-fpm.d/www.conf
    regexp: "^;?{{ item.key }} ="
    line: "{{ item.key }} = {{ item.value }}"
    # https://stackoverflow.com/a/21934455/2681752
  with_items:
    - { key: "access.log",           value: "/var/log/php-fpm/$pool.access.log" }
    - { key: "user",                 value: "{{ www_owner }}"                   }
    - { key: "group",                value: "{{ www_group }}"                   }
    - { key: "listen",               value: "/var/run/php-fpm/php-fpm.sock"     }
    - { key: "listen.acl_users",     value: "nginx"                             }
    - { key: "pm",                   value: "static"                            }
    - { key: "pm.max_children",      value: 2                                   }
    - { key: "pm.max_requests",      value: 7500                                }
    - { key: "pm.status_path",       value: "/status-php-fpm"                   }
  notify:
    - restart php-fpm

- name: configuration for PHP applications added
  copy:
    src: php.conf
    dest: /etc/nginx/default.d/php.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: php-fpm status page in Nginx configured
  template:
    src: vhost-nginx.conf.j2
    dest: /etc/nginx/conf.d/local.conf-php-fpm
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm

- name: php-fpm started and enabled
  service:
    name: php-fpm
    state: started
    enabled: yes

- name: monit snippet installed
  template:
    src: monit.j2
    dest: /etc/monit.d/php-fpm
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit

- name: collectd snippet installed
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.d/php-fpm.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

- name: specific php-fpm types configured
  lineinfile:
    path: /usr/share/collectd/types.db
    regexp: "^{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  with_items:
    - { key: "phpfpm_listen_queue",  value: "value:GAUGE:0:65535" }
    - { key: "phpfpm_processes",     value: "value:GAUGE:0:65535" }
    - { key: "phpfpm_requests",      value: "value:DERIVE:0:U" }
    - { key: "phpfpm_slow_requests", value: "value:DERIVE:0:U" }
  notify:
    - restart collectd

