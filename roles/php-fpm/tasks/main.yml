---

- name: php-fpm installed
  yum:
    name: php-fpm
    state: present

- name: php-fpm configuration file installed
  ini_file:
    path: /etc/php-fpm.conf
    section: "global"
    option: "pid"
    value: "{{ php_fpm_pid_path }}"

- name: php-fpm nginx configuration file installed
  template:
    src: php-fpm.conf.j2
    dest: /etc/nginx/conf.d/php-fpm.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: php-fpm pool configured
  lineinfile:
    backrefs: yes
    path: /etc/php-fpm.d/www.conf
    regexp: "{{ item.re }}"
    line: "{{ item.name }} = {{ item.value }}"
    # https://stackoverflow.com/a/21934455/2681752
  with_items:
    - { re: "^;access.log =",          name: "access.log",           value: "/var/log/php-fpm/$pool.access.log" }
    - { re: "^listen =",               name: "listen",               value: "/var/run/php-fpm/php-fpm.sock"     }
    - { re: "^;listen.acl_users =",    name: "listen.acl_users",     value: "nginx"                             }
    - { re: "^pm =",                   name: "pm",                   value: "static"                            }
    - { re: "^pm.max_children =",      name: "pm.max_children",      value: 2                                   }
    - { re: "^;pm.max_requests =",     name: "pm.max_requests",      value: 7500                                }
    - { re: "^;pm.status_path =",      name: "pm.status_path",       value: "/status-php-fpm"                   }
  notify:
    - restart php-fpm

- name: configuration for PHP applications added
  copy:
    src: php.conf
    dest: /etc/nginx/default.d/php.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: php-fpm status page in Nginx configured
  template:
    src: vhost-nginx.conf.j2
    dest: /etc/nginx/conf.d/local.conf-php-fpm
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm

- name: php-fpm started and enabled
  service:
    name: php-fpm
    state: started
    enabled: yes

- name: monit snippet installed
  template:
    src: monit.j2
    dest: /etc/monit.d/php-fpm
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit

- name: collectd snippet installed
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.d/php-fpm.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

