---

- name: install php-fpm
  yum:
    name: php56-fpm
    state: present

- name: configure php-fpm
  lineinfile:
    path: /etc/nginx/conf.d/php-fpm.conf-5.6
    regexp: '^\s*server\s'
    line: '        server unix:{{ php_fpm_socket_path }};'

- name: configure php-fpm pool
  template:
    src: www.conf.j2
    dest: /etc/php-fpm-5.6.d/www.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm

- name: add configuration for PHP applications
  copy:
    src: php.conf-5.6
    dest: /etc/nginx/default.d/php.conf-5.6
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: configure php-fpm status page in Nginx
  template:
    src: vhost-nginx.conf.j2
    dest: /etc/nginx/conf.d/local.conf-php-fpm
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php-fpm

- name: enable php-fpm
  service:
    name: php-fpm
    state: started
    enabled: yes
