---

- name: openssh installed
  yum:
    name: openssh
    state: present

- name: sshd configured
  lineinfile:
    backrefs: yes
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  notify:
    - restart sshd
  with_items:
    - { key: "Port", value: "{{ ssh_port }}" }

- name: restricted file permissions set
  file:
    path: /etc/ssh
    mode: 0600

# - name: motd installed
#   template: src=motd.j2 dest=/etc/motd owner=root group=root mode=0644

# Ensure OpenSSH reload its conf so that it uses the new Port
# and we don't have to wait for the Playbook to finish
- name: make sshd reload its conf
  command: /usr/bin/systemctl reload sshd

- name: sshd started and enabled
  service:
    name: sshd
    enabled: yes
    state: started
