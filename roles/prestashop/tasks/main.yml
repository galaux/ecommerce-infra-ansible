---

## Database

- name: state whether Prestashop is already installed
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute 'USE {{ mysql_ps_db_name }};' \
      && \
      test -d "{{ prestashop_path }}"
  register: ps_already_present
  check_mode: no
  failed_when: ps_already_present.rc > 1

- name: SQL DB created
  mysql_db:
    name: "{{ mysql_ps_db_name }}"
    state: present

- name: Prestashop SQL account created
  mysql_user:
    name: '{{ mysql_ps_user }}'
    host: 'localhost'
    password: '{{ mysql_ps_password }}'
    priv: '{{ mysql_ps_db_name }}.*:ALL'
    state: present

- name: Prestashop DB backup available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/db_ps.sql.bz2"
    dest: /tmp/db_ps.sql.bz2
    mode: get
  when: ps_already_present.rc == 1

- name: Prestashop DB populated
  mysql_db:
    name: "{{ mysql_ps_db_name }}"
    state: import
    target: /tmp/db_ps.sql.bz2
  when: ps_already_present.rc == 1

- name: Prestashop shop URL set
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE pss_shop_url \
                 SET \
                   domain = 'www.{{ main_domain_name }}', \
                   domain_ssl = 'www.{{ main_domain_name }}' \
                 WHERE id_shop_url = 1;" \
      "{{ mysql_ps_db_name }}"

- name: Prestashop shop URL in configuration set
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE pss_configuration \
                 SET \
                   value = 'www.{{ main_domain_name }}' \
                 WHERE name = '{{ item }}';" \
      "{{ mysql_ps_db_name }}"
  with_items:
    - PS_SHOP_DOMAIN
    - PS_SHOP_DOMAIN_SSL


## Web files

- name: Prestashop version file downloaded from S3 backup
  check_mode: no
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/prestashop_version"
    dest: "/tmp/{{ prestashop_version_file_name }}"
    mode: get

# Watch out, prestashop_version is used in settings.inc.php
- name: Prestashop version read from S3 backup
  shell: cat /tmp/{{ prestashop_version_file_name }}
  check_mode: no
  register: prestashop_version

- name: Prestashop vanilla files downloaded
  unarchive:
    remote_src: yes
    src: "https://www.prestashop.com/download/old/prestashop_{{ prestashop_version.stdout }}.zip"
    dest: "{{ www_path }}"
    creates: "{{ prestashop_path }}"
    exclude: Install_PrestaShop.html
  when: ps_already_present.rc == 1

- name: install directory removed
  file:
    state: absent
    path: "{{ prestashop_path }}/install"
  when: ps_already_present.rc == 1

- name: admin directory renamed
  command: mv "{{ prestashop_path }}/admin" "{{ prestashop_path }}/{{ prestashop_admin_page_name }}"
  when: ps_already_present.rc == 1

- name: backups from S3 available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/{{ item.tarball }}"
    dest: "/tmp/{{ item.tarball }}"
    mode: get
  with_items: "{{ prestashop_backups }}"
  when: ps_already_present.rc == 1

- name: backups deployed
  unarchive:
    src: "/tmp/{{ item.tarball }}"
    dest: "{{ prestashop_path }}"
    remote_src: yes
  with_items: "{{ prestashop_backups }}"
  when: ps_already_present.rc == 1

# Without this file, some PS features do not work (such as disabling cache)
- name: compulsory .htaccess created
  copy:
    content: ""
    dest: "{{ prestashop_path }}/.htaccess"
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0644

- name: robots.txt downloaded from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/robots.txt"
    dest: "{{ prestashop_path }}/robots.txt"
    mode: get
  when: ps_already_present.rc == 1

- name: Prestashop configuration file installed
  template:
    src: settings.inc.php.j2
    dest: "{{ prestashop_path }}/config/settings.inc.php"
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0664
  notify:
    - restart php-fpm

- name: files and directories owner/group set
  file:
    path: "{{ prestashop_path }}"
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0664
    state: directory
    recurse: yes

- name: directories permissions set
  command: find "{{ prestashop_path }}" -type d -exec chmod 0775 {} +

- name: Nginx configuration installed
  template:
    src: vhost-nginx.conf
    dest: /etc/nginx/conf.d/www.conf-prestashop
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx


# Test config only

- name: test instance only - data backup snippet absent
  file:
    path: "{{ backup_data_snippet_dir }}/prestashop"
    state: absent
  when: not is_prod


# Production config only

- name: production instance only - data backup snippet present
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/prestashop"
    owner: root
    group: root
    mode: 0755
  when: is_prod

