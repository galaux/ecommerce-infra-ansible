---

## Database

- name: stat whether DB is already present
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute 'USE {{ mysql_ps_db_name }};'
  register: db_already_present
  check_mode: no
  failed_when: db_already_present.rc > 1

- name: create DB
  mysql_db:
    name: "{{ mysql_ps_db_name }}"
    state: present

- name: create PS account
  mysql_user:
    name: '{{ mysql_ps_user }}'
    host: 'localhost'
    password: '{{ mysql_ps_password }}'
    priv: '{{ mysql_ps_db_name }}.*:ALL'
    state: present

- name: retrieve DB backup from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/db_ps.sql.bz2"
    dest: /tmp/db_ps.sql.bz2
    mode: get
  when: db_already_present.rc == 1

- name: Restore DB
  mysql_db:
    name: "{{ mysql_ps_db_name }}"
    state: import
    target: /tmp/db_ps.sql.bz2
  when: db_already_present.rc == 1

- name: set shop URL 1
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE pss_shop_url \
                 SET \
                   domain = 'www.{{ main_domain_name }}', \
                   domain_ssl = 'www.{{ main_domain_name }}' \
                 WHERE id_shop_url = 1;" \
      "{{ mysql_ps_db_name }}"

- name: set shop URL 2
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE pss_configuration \
                 SET \
                   value = 'www.{{ main_domain_name }}' \
                 WHERE name = '{{ item }}';" \
      "{{ mysql_ps_db_name }}"
  with_items:
    - PS_SHOP_DOMAIN
    - PS_SHOP_DOMAIN_SSL


## Web files

- name: stat whether Prestashop is already present
  command: test -d "{{ prestashop_path }}"
  # https://github.com/ansible/ansible-modules-core/issues/3356
  check_mode: no
  register: ps_already_present
  failed_when: ps_already_present.rc > 1

- name: get Prestashop version file from S3 backup
  check_mode: no
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/prestashop_version"
    dest: "/tmp/{{ prestashop_version_file_name }}"
    mode: get

# Watch out, prestashop_version is used in settings.inc.php
- name: read Prestashop version from S3 backup
  shell: cat /tmp/{{ prestashop_version_file_name }}
  check_mode: no
  register: prestashop_version

- name: download Prestashop vanilla files
  unarchive:
    remote_src: yes
    src: "https://www.prestashop.com/download/old/prestashop_{{ prestashop_version.stdout }}.zip"
    dest: "{{ www_path }}"
    creates: "{{ prestashop_path }}"
    owner: apache
    group: apache
    mode: 0664
    exclude: Install_PrestaShop.html
  when: ps_already_present.rc == 1

- name: remove install directory
  file:
    state: absent
    path: "{{ prestashop_path }}/install"
  when: ps_already_present.rc == 1

- name: rename admin directory
  command: mv "{{ prestashop_path }}/admin" "{{ prestashop_path }}/{{ prestashop_admin_page_name }}"
  when: ps_already_present.rc == 1

- name: retrieve backups from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/{{ item.tarball }}"
    dest: "/tmp/{{ item.tarball }}"
    mode: get
  with_items: "{{ prestashop_backups }}"
  when: ps_already_present.rc == 1

- name: deploy backups
  unarchive:
    src: "/tmp/{{ item.tarball }}"
    dest: "{{ prestashop_path }}"
    remote_src: yes
  with_items: "{{ prestashop_backups }}"
  when: ps_already_present.rc == 1

# Without this file, some PS features do not work (such as disabling cache)
- name: create compulsory .htaccess
  copy:
    content: ""
    dest: "{{ prestashop_path }}/.htaccess"
    owner: apache
    group: apache
    mode: 0644

- name: retrieve robots.txt from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/robots.txt"
    dest: "{{ prestashop_path }}/robots.txt"
    mode: get
  when: ps_already_present.rc == 1

- name: install config file
  template:
    src: settings.inc.php.j2
    dest: "{{ prestashop_path }}/config/settings.inc.php"
    owner: apache
    group: apache
    mode: 0664

- name: set files and directories owner/group
  file:
    path: "{{ prestashop_path }}"
    owner: apache
    group: apache
    mode: 0664
    state: directory
    recurse: yes

- name: set directories permissions
  command: find "{{ prestashop_path }}" -type d -exec chmod 0775 {} +

- name: set Nginx config
  template:
    src: vhost-nginx.conf
    dest: /etc/nginx/conf.d/www.conf-prestashop
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: set data backup snippet
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/prestashop"
    owner: root
    group: root
    mode: 0755
  when: is_prod

