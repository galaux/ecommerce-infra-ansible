---

- name: stat whether Prestashop is already present
  command: test -d "{{ prestashop_path }}"
  # https://github.com/ansible/ansible-modules-core/issues/3356
  check_mode: no
  register: ps_already_present
  failed_when: ps_already_present.rc > 1

- name: download Prestashop vanilla files
  unarchive:
    remote_src: yes
    src: "https://www.prestashop.com/download/old/prestashop_{{ prestashop_version }}.zip"
    dest: "{{ www_path }}"
    creates: "{{ prestashop_path }}"
    owner: apache
    group: apache
    mode: 0664
    exclude: Install_PrestaShop.html
  when: ps_already_present.rc == 1

- name: remove install directory
  file:
    state: absent
    path: "{{ prestashop_path }}/install"
  when: ps_already_present.rc == 1

- name: rename admin directory
  command: mv "{{ prestashop_path }}/admin" "{{ prestashop_path }}/FuckMyAdm1n"
  when: ps_already_present.rc == 1

- name: retrieve backups from S3
  aws_s3:
    bucket: prestashop-data
    object: "/{{ backup_date }}/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: get
  with_items: "{{ prestashop_tarballs }}"
  when: ps_already_present.rc == 1

- name: retrieve robots.txt from S3
  aws_s3:
    bucket: prestashop-data
    object: "/{{ backup_date }}/robots.txt"
    dest: "{{ prestashop_path }}/robots.txt"
    mode: get
  when: ps_already_present.rc == 1

- name: deploy backups
  unarchive:
    src: /tmp/{{ item }}
    dest: "{{ prestashop_path }}"
    remote_src: yes
  with_items: "{{ prestashop_tarballs }}"
  when: ps_already_present.rc == 1

- name: install config file
  template: >
   src=settings.inc.php.j2
   dest="{{ prestashop_path }}/config/settings.inc.php"
   owner=apache
   group=apache
   mode=0644

- name: set files and directories owner/group
  file:
    path: "{{ prestashop_path }}"
    owner: apache
    group: apache
    state: directory
    recurse: yes

- name: set files permissions
  command: find "{{ prestashop_path }}" -type d -exec chmod 0755 {} \;

- name: set directories permissions
  command: find "{{ prestashop_path }}" -type f -exec chmod 0644 {} \;

- name: set Nginx config
  template: >
   src=nginx-prestashop.conf.j2
   dest=/etc/nginx/conf.d/prestashop.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

