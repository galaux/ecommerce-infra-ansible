---

- name: install MariaDB repository
  copy:
    src: mariadb.repo
    dest: /etc/yum.repos.d/mariadb.repo
    owner: root
    group: root
    mode: 0644

- name: install MariaDB and dependencies
  yum:
    # MySQL-python required by Ansible `mysql_user`
    name: >
      mariadb-server,
      MySQL-python
    state: present

- name: set global my.cnf
  ini_file:
    path: /etc/my.cnf.d/server.cnf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "server", option: "pid_file",          value: "{{ mysql_pid_path }}" }
    - { section: "mysqld", option: "slow_query_log",    value: 1 }
    - { section: "mysqld", option: "max_connections",   value: 5 }
    - { section: "mysqld", option: "thread_cache_size", value: 1 }
    - { section: "mysqld", option: "query_cache_type",  value: 'ON' }
    - { section: "mysqld", option: "query_cache_size",  value: 41943040 }
  notify:
    - restart mariadb

- name: start and enable MariaDB
  service:
    name: mariadb
    enabled: yes
    state: started

- name: remove anonymous accounts
  mysql_user:
    name: ''
    host_all: yes
    state: absent

- name: drop test database
  mysql_db:
    db: test
    state: absent

# - name: create read only account
#   mysql_user:
#     name: "{{ mysql_ro_user }}"
#     host: 'localhost'
#     password: "{{ mysql_ro_password }}"
#     priv: '{{ mysql_ps_db_name }}.*:SELECT'
#     state: present

- name: create/set root account
  mysql_user:
    name: 'root'
    host_all: yes
    password: '{{ mysql_root_password }}'
    state: present

- name: set local my.cnf
  template:
    src: local-my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: 0600
