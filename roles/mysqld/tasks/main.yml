---

- name: install MySQL and dependencies
  yum: >
    name=mysql56-server,MySQL-python27
    state=present

- name: start and enable MySQL
  service: >
    name=mysqld
    enabled=yes
    state=started

- name: remove anonymous accounts
  mysql_user:
    name: ''
    host_all: yes
    state: absent

- name: create PS account
  mysql_user:
    name: 'ps_std'
    host: 'localhost'
    password: 'REDACTED5000000000000000'
    priv: 'ps_std.*:ALL'
    state: present

- name: create read only account
  mysql_user:
    name: "{{ mysql_ro_user }}"
    host: 'localhost'
    password: "{{ mysql_ro_password }}"
    priv: 'ps_std.*:SELECT'
    state: present

- name: create/set root account
  mysql_user:
    name: 'root'
    host_all: yes
    password: 'REDACTED8000000000000000'
    state: present

- name: set global my.cnf
  template: >
   src=global-my.cnf.j2
   dest=/etc/my.cnf
   owner=root
   group=root
   mode=0644

- name: set local my.cnf
  template: >
   src=local-my.cnf.j2
   dest=/root/.my.cnf
   owner=root
   group=root
   mode=0600

- name: stat whether DB is already present
  shell: mysql -e 'USE ps_std;'
  register: db_already_present
  failed_when: db_already_present.rc > 1

- name: create DB
  mysql_db:
    name: ps_std
    state: present

- name: retrieve DB backup from S3
  aws_s3:
    bucket: prestashop-data
    object: "/{{ backup_date }}/db_ps.sql.bz2"
    dest: /tmp/db_ps.sql.bz2
    mode: get
  when: db_already_present.rc == 1

- name: Restore DB
  mysql_db:
    name: ps_std
    state: import
    target: /tmp/db_ps.sql.bz2
  when: db_already_present.rc == 1

- name: configure logrotate
  copy: >
   src=logrotate
   dest=/etc/logrotate.d/mysqld
   owner=root
   group=root
   mode=0644
