---

- name: MariaDB RPM repository enabled
  copy:
    src: mariadb.repo
    dest: /etc/yum.repos.d/mariadb.repo
    owner: root
    group: root
    mode: 0644

- name: MariaDB and dependencies installed
  yum:
    # MySQL-python required by Ansible `mysql_user`
    name: >
      mariadb-server,
      MySQL-python
    state: present

- name: global my.cnf installed
  ini_file:
    path: /etc/my.cnf.d/server.cnf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "server", option: "pid_file",          value: "{{ mysql_pid_path }}" }
    - { section: "mysqld", option: "slow_query_log",    value: 1 }
    - { section: "mysqld", option: "max_connections",   value: 5 }
    - { section: "mysqld", option: "thread_cache_size", value: 1 }
    - { section: "mysqld", option: "query_cache_type",  value: 'ON' }
    - { section: "mysqld", option: "query_cache_size",  value: 41943040 }
  notify:
    - restart mariadb

- name: MariaDB started and enabled
  service:
    name: mariadb
    enabled: yes
    state: started

- name: anonymous accounts removed
  mysql_user:
    name: ''
    host_all: yes
    state: absent

- name: test database dropped
  mysql_db:
    db: test
    state: absent

# - name: read only account created
#   mysql_user:
#     name: "{{ mysql_ro_user }}"
#     host: 'localhost'
#     password: "{{ mysql_ro_password }}"
#     priv: '{{ mysql_ps_db_name }}.*:SELECT'
#     state: present

- name: root account configured
  mysql_user:
    name: 'root'
    host_all: yes
    password: '{{ mysql_root_password }}'
    state: present

- name: local my.cnf for root installed
  template:
    src: local-my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: 0600

- name: monit and collectd snippet directories created
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  with_items:
    - /etc/collectd.d
    - /etc/monit.d

- name: monit snippet installed
  template:
    src: monit.j2
    dest: /etc/monit.d/mysqld
    owner: root
    group: root
    mode: 0600
  notify:
    - reload monit

- name: collectd snippet installed
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.d/mysqld.conf
    owner: root
    group: root
    mode: 0600
  notify:
    - restart collectd

