---

- name: install MySQL and dependencies
  yum: >
    name=mysql56-server,MySQL-python27
    state=present

- name: start and enable MySQL
  service: >
    name=mysqld
    enabled=yes
    state=started

- name: stat whether DB is already present
  shell: mysql -e 'USE {{ mysql_ps_db_name }};'
  register: db_already_present
  failed_when: db_already_present.rc > 1

- name: create DB
  mysql_db:
    name: "{{ mysql_ps_db_name }}"
    state: present

- name: retrieve DB backup from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/db_ps.sql.bz2"
    dest: /tmp/db_ps.sql.bz2
    mode: get
  when: db_already_present.rc == 1

- name: Restore DB
  mysql_db:
    name: "{{ mysql_ps_db_name }}"
    state: import
    target: /tmp/db_ps.sql.bz2
  when: db_already_present.rc == 1

- name: set shop URL 1
  shell: >
    mysql \
      --execute="UPDATE pss_shop_url \
                 SET \
                   domain = 'www.{{ fqdn }}', \
                   domain_ssl = 'www.{{ fqdn }}' \
                 WHERE id_shop_url = 1;" \
      "{{ mysql_ps_db_name }}"

- name: set shop URL 2
  shell: >
    mysql \
      --execute="UPDATE pss_configuration \
                 SET \
                   value = 'www.{{ fqdn }}' \
                 WHERE name = '{{ item }}';" \
      "{{ mysql_ps_db_name }}"
  with_items:
    - PS_SHOP_DOMAIN
    - PS_SHOP_DOMAIN_SSL

- name: remove anonymous accounts
  mysql_user:
    name: ''
    host_all: yes
    state: absent

- name: create PS account
  mysql_user:
    name: '{{ mysql_ps_user }}'
    host: 'localhost'
    password: '{{ mysql_ps_password }}'
    priv: '{{ mysql_ps_db_name }}.*:ALL'
    state: present

- name: create read only account
  mysql_user:
    name: "{{ mysql_ro_user }}"
    host: 'localhost'
    password: "{{ mysql_ro_password }}"
    priv: '{{ mysql_ps_db_name }}.*:SELECT'
    state: present

- name: create/set root account
  mysql_user:
    name: 'root'
    host_all: yes
    password: '{{ mysql_root_password }}'
    state: present

- name: set global my.cnf
  template: >
   src=global-my.cnf.j2
   dest=/etc/my.cnf
   owner=root
   group=root
   mode=0644

- name: set local my.cnf
  template: >
   src=local-my.cnf.j2
   dest=/root/.my.cnf
   owner=root
   group=root
   mode=0600

- name: configure logrotate
  copy: >
   src=logrotate
   dest=/etc/logrotate.d/mysqld
   owner=root
   group=root
   mode=0644
