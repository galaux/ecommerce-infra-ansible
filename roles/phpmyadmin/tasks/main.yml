---

- name: install phpMyAdmin
  yum: >
    name=phpMyAdmin
    enablerepo=epel
    state=present

- name: configure phpMyAdmin
  template: >
   src=config.inc.php.j2
   dest=/etc/phpMyAdmin/config.inc.php
   owner=root
   group=apache
   mode=0640

- name: configure phpMyAdmin for Nginx
  file:
    src: "/usr/share/phpMyAdmin/"
    dest: "{{ www_path }}/phpmyadmin"
    state: link
  notify:
    - restart nginx
