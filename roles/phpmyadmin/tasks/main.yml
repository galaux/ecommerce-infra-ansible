---

- name: phpMyAdmin installed
  yum:
    name: phpMyAdmin
    enablerepo: epel
    state: present

- name: phpMyAdmin configured
  lineinfile:
    path: /etc/phpMyAdmin/config.inc.php
    regexp: "^\\$cfg\\['Servers'\\]\\[\\$i\\]\\['{{ item.key }}'\\]"
    line: "$cfg['Servers'][$i]['{{ item.key }}'] = '{{ item.value }}';"
  with_items:
    - { key: "auth_type", value: 'config' }
    - { key: "user",      value: '{{ phpmyadmin_sql_user }}' }
    - { key: "password",  value: '{{ phpmyadmin_sql_password }}' }
    - { key: "hide_db",   value: 'information_schema' }

- name: phpMyAdmin SQL account created
  mysql_user:
    name: "{{ phpmyadmin_sql_user }}"
    host: 'localhost'
    password: "{{ phpmyadmin_sql_password }}"
    priv: '{{ mysql_ps_db_name }}.*:SELECT,UPDATE'
    state: present

- name: phpMyAdmin files available for Nginx
  file:
    src: "/usr/share/phpMyAdmin/"
    dest: "{{ www_path }}/{{ phpmyadmin_url_path }}"
    state: link
  notify:
    - restart nginx

- name: phpMyAdmin Nginx config installed
  template:
    src: vhost-nginx.j2
    dest: /etc/nginx/conf.d/admin.conf-phpmyadmin
    owner: root
    group: apache
    mode: 0640
  notify:
    - restart nginx
