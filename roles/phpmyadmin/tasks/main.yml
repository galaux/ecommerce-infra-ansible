---

- name: phpMyAdmin installed
  yum:
    name: phpMyAdmin
    enablerepo: epel
    state: present

- name: phpMyAdmin configured
  lineinfile:
    backrefs: yes
    path: /etc/phpMyAdmin/config.inc.php
    regexp: "{{ item.re }}"
    line: "{{ item.name }} = '{{ item.value }}';"
  with_items:
    - { re: "^\\$cfg\\['Servers'\\]\\[\\$i\\]\\['auth_type'\\]",
        name: "$cfg['Servers'][$i]['auth_type']",
        value: 'config' }
    - { re: "^\\$cfg\\['Servers'\\]\\[\\$i\\]\\['user'\\]",
        name: "$cfg['Servers'][$i]['user']",
        value: '{{ phpmyadmin_sql_user }}' }
    - { re: "^\\$cfg\\['Servers'\\]\\[\\$i\\]\\['password'\\]",
        name: "$cfg['Servers'][$i]['password']",
        value: '{{ phpmyadmin_sql_password }}' }
    - { re: "^\\$cfg\\['Servers'\\]\\[\\$i\\]\\['hide_db'\\]",
        name: "$cfg['Servers'][$i]['hide_db']",
        value: 'information_schema' }

- name: phpMyAdmin SQL account created
  mysql_user:
    name: "{{ phpmyadmin_sql_user }}"
    host: 'localhost'
    password: "{{ phpmyadmin_sql_password }}"
    priv: '{{ mysql_ps_db_name }}.*:SELECT'
    state: present

- name: phpMyAdmin files available for Nginx
  file:
    src: "/usr/share/phpMyAdmin/"
    dest: "{{ www_path }}/{{ phpmyadmin_url_path }}"
    state: link
  notify:
    - restart nginx

- name: phpMyAdmin Nginx config installed
  template:
    src: vhost-nginx.j2
    dest: /etc/nginx/conf.d/admin.conf-phpmyadmin
    owner: root
    group: apache
    mode: 0640
  notify:
    - restart nginx
