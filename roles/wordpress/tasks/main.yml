---

## Database

- name: state whether Worpress is already installed
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute 'USE {{ mysql_wp_db_name }};' \
      && \
      test -d "{{ wordpress_path }}"
  register: wp_already_present
  check_mode: no
  failed_when: wp_already_present.rc > 1

- name: create WP DB
  mysql_db:
    name: "{{ mysql_wp_db_name }}"
    state: present

- name: create WP DB account
  mysql_user:
    name: '{{ mysql_wp_user }}'
    host: 'localhost'
    password: '{{ mysql_wp_password }}'
    priv: '{{ mysql_wp_db_name }}.*:ALL'
    state: present

- name: retrieve DB backup from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/wordpress/db_wp.sql.bz2"
    dest: /tmp/db_wp.sql.bz2
    mode: get
  when: wp_already_present.rc == 1

- name: Restore DB
  mysql_db:
    name: "{{ mysql_wp_db_name }}"
    state: import
    target: /tmp/db_wp.sql.bz2
  when: wp_already_present.rc == 1

- name: set WP SiteUrl in DB
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE wp_options \
                 SET \
                   option_value = 'https://blog.{{ main_domain_name }}' \
                 WHERE option_name = 'siteurl';" \
      "{{ mysql_wp_db_name }}"

- name: set WP Home in DB
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE wp_options \
                 SET \
                   option_value = 'https://blog.{{ main_domain_name }}' \
                 WHERE option_name = 'home';" \
      "{{ mysql_wp_db_name }}"


## Web files

- name: retrieve Wordpress files from S3
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/wordpress/wordpress.tgz"
    dest: /tmp/wordpress.tgz
    mode: get
  when: wp_already_present.rc == 1

- name: install Wordpress files
  unarchive:
    remote_src: yes
    src: /tmp/wordpress.tgz
    dest: "{{ www_path }}"
    creates: "{{ wordpress_path }}"
    owner: apache
    group: apache
    mode: 0664
  when: wp_already_present.rc == 1

- name: set files and directories owner/group
  file:
    path: "{{ wordpress_path }}"
    owner: apache
    group: apache
    mode: 0664
    state: directory
    recurse: yes

- name: set directories permissions
  command: find "{{ wordpress_path }}" -type d -exec chmod 0775 {} +

- name: production instance only - set data backup snippet
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/wordpress"
    owner: root
    group: root
    mode: 0755
  when: is_prod

- name: test instance only - remove any data backup snippet
  file:
    path: "{{ backup_data_snippet_dir }}/wordpress"
    state: absent
  when: not is_prod

