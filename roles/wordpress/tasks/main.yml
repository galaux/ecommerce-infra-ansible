---

## Database

- name: state whether Worpress is already installed
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute 'USE {{ mysql_wp_db_name }};' \
      && \
      test -d "{{ wordpress_path }}"
  register: wp_already_present
  check_mode: no
  failed_when: wp_already_present.rc > 1

- name: Wordpress DB created
  mysql_db:
    name: "{{ mysql_wp_db_name }}"
    state: present

- name: Wordpress SQL account created
  mysql_user:
    name: '{{ mysql_wp_user }}'
    host: 'localhost'
    password: '{{ mysql_wp_password }}'
    priv: '{{ mysql_wp_db_name }}.*:ALL'
    state: present

- name: DB backup from S3 available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/wordpress/db_wp.sql.bz2"
    dest: /tmp/db_wp.sql.bz2
    mode: get
  when: wp_already_present.rc == 1

- name: Wordpress DB populated
  mysql_db:
    name: "{{ mysql_wp_db_name }}"
    state: import
    target: /tmp/db_wp.sql.bz2
  when: wp_already_present.rc == 1

- name: Wordpress SiteUrl set in DB
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE wp_options \
                 SET \
                   option_value = 'https://blog.{{ main_domain_name }}' \
                 WHERE option_name = 'siteurl';" \
      "{{ mysql_wp_db_name }}"

- name: Wordpress Home set in DB
  shell: >
    mysql \
      --defaults-extra-file=/root/.my.cnf \
      --execute="UPDATE wp_options \
                 SET \
                   option_value = 'https://blog.{{ main_domain_name }}' \
                 WHERE option_name = 'home';" \
      "{{ mysql_wp_db_name }}"


## Web files

- name: Wordpress files from S3 available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/wordpress/wordpress.tgz"
    dest: /tmp/wordpress.tgz
    mode: get
  when: wp_already_present.rc == 1

- name: Wordpress files installed
  unarchive:
    remote_src: yes
    src: /tmp/wordpress.tgz
    dest: "{{ www_path }}"
    creates: "{{ wordpress_path }}"
  when: wp_already_present.rc == 1

- name: files and directories owner/group set
  file:
    path: "{{ wordpress_path }}"
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0664
    state: directory
    recurse: yes

- name: directories permissions set
  command: find "{{ wordpress_path }}" -type d -exec chmod 0775 {} +

- name: Nginx configuration installed
  copy:
    src: vhost-nginx.conf
    dest: /etc/nginx/conf.d/blog.conf-wordpress
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx


# Test config only

- name: test instance only - data backup snippet absent
  file:
    path: "{{ backup_data_snippet_dir }}/wordpress"
    state: absent
  when: not do_backup


# Production config only

- name: production instance only - data backup snippet present
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/wordpress"
    owner: root
    group: root
    mode: 0755
  when: do_backup

