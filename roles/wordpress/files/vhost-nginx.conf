# Several rules given by https://codex.wordpress.org/Nginx

# Deny all attempts to access hidden files
location ~ /\. {
    deny all;
}

# Deny access to any files with a .php extension in the uploads directory
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
}

# Pretty Permalinks functionality
location / {
    try_files $uri $uri/ /index.php?$args;
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
    expires max;
}


# "Move Login" plugin conf
rewrite ^/postpass/?$ /wp-login.php?action=postpass last;
rewrite ^/bl0gl0g0ut/?$ /wp-login.php?action=logout last;
rewrite ^/l0stpassw0rd/?$ /wp-login.php?action=lostpassword last;
rewrite ^/resetpassw0rd/?$ /wp-login.php?action=resetpass last;
rewrite ^/bl0greg1ster/?$ /wp-login.php?action=register last;
rewrite ^/bl0gl0g1n/?$ /wp-login.php last;
