---

- name: install main backup script
  template:
    src: backup-instance.sh.j2
    dest: /usr/local/bin/backup-instance
    owner: root
    group: root
    mode: 0755

- name: create snippet directory
  file:
    path: "{{ backup_data_snippet_dir }}"
    state: directory
    owner: root
    group: root
    mode: 0755

- name: production instance only - setup cron to backup instance
  copy:
    src: backup-instance.cron
    dest: /etc/cron.d/backup-instance
    owner: root
    group: root
    mode: 0644
  notify:
    - reload crond
  when: is_prod

- name: test instance only - install Systemd service to backup instance at boot
  copy:
    src: backup-instance.service
    dest: /etc/systemd/system/backup-instance.service
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload
  when: not is_prod

- name: test instance only - enable Systemd service to backup instance at boot
  service:
    name: backup-instance.service
    enabled: yes
  when: not is_prod

