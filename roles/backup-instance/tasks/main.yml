---

- name: main backup script installed
  template:
    src: backup-instance.sh.j2
    dest: /usr/local/bin/backup-instance
    owner: root
    group: root
    mode: 0755

- name: snippet directory exists
  file:
    path: "{{ backup_data_snippet_dir }}"
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Systemd instance backup service installed
  template:
    src: backup-instance.service.j2
    dest: /etc/systemd/system/backup-instance.service
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload

- name: Systemd instance backup timer installed
  copy:
    src: backup-instance.timer
    dest: /etc/systemd/system/backup-instance.timer
    owner: root
    group: root
    mode: 0644
  notify:
    - daemon reload


# Test config only

- name: test instance only - instance backup enabled at boot
  service:
    name: backup-instance.service
    enabled: yes
  when: not is_prod

- name: test instance only - instance backup timer disabled
  service:
    name: backup-instance.timer
    enabled: no
    state: stopped
  when: not is_prod


# Production config only

- name: production instance only - instance backup disabled at boot
  service:
    name: backup-instance.service
    enabled: no
  when: is_prod

- name: production instance only - instance backup timer enabled
  service:
    name: backup-instance.timer
    enabled: yes
    state: started
  when: is_prod

