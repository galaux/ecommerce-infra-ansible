---

- name: collectd installed
  yum:
    name: >
      collectd,
      collectd-curl_json,
      collectd-mysql,
      collectd-nginx,
      collectd-rrdtool
    state: present

- name: state whether data is already present
  command: test -d "{{ collectd_instance_data_path }}"
  check_mode: no
  register: collectd_data_already_present
  failed_when: collectd_data_already_present.rc > 1

- name: collected data backup available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/collectd-data.tgz"
    dest: "/tmp/collectd-data.tgz"
    mode: get
  when: collectd_data_already_present.rc == 1

- name: collected data backup deployed
  unarchive:
    src: /tmp/collectd-data.tgz
    dest: /var/lib
    remote_src: yes
  when: collectd_data_already_present.rc == 1

- name: collectd configured
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

- name: collectd snippets installed
  template:
    src: "{{ item }}.conf.j2"
    dest: /etc/collectd.d/{{ item }}.conf
    owner: root
    group: root
    mode: 0644
  with_items:
    - df
    - nginx
    - mysql
    - processes
    - unixsock
  notify:
    - restart collectd

- name: collectd SQL account created
  mysql_user:
    name: "{{ collectd_sql_user }}"
    host: 'localhost'
    password: "{{ collectd_sql_password }}"
    priv: '{{ mysql_ps_db_name }}.*:SELECT'
    state: present

- name: state whether CGP is already present
  command: test -d "{{ monitoring_path }}"
  check_mode: no
  register: cgp_already_present
  failed_when: cgp_already_present.rc > 1

- name: CGP directory created
  file:
    path: "{{ monitoring_path }}"
    state: directory
    owner: apache
    group: apache
    mode: 0755

- name: CGP files installed
  unarchive:
    remote_src: yes
    src: "https://github.com/pommi/CGP/archive/v1.tar.gz"
    dest: "{{ monitoring_path }}"
    extra_opts: [--strip-components=1]
    owner: apache
    group: apache
    mode: 0755
  when: cgp_already_present.rc == 1

- name: files and directories owner/group set
  file:
    path: "{{ monitoring_path }}"
    owner: apache
    group: apache
    mode: 0644
    state: directory
    recurse: yes

- name: CGP configured
  lineinfile:
    path: "{{ monitoring_path }}/conf/config.php"
    regexp: "^\\$CONFIG\\['{{ item.key }}'\\]"
    line: "$CONFIG['{{ item.key }}'] = {{ item.value }};"
  with_items:
    - { key: "graph_smooth", value: "true" }

- name: directories permissions set
  command: find "{{ monitoring_path }}" -type d -exec chmod 0755 {} +

- name: /monitoring nginx access configured
  template:
    src: vhost-nginx.j2
    dest: /etc/nginx/conf.d/admin.conf-monitoring
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: collectd started and enabled at boot
  service:
    name: collectd
    state: started
    enabled: yes


# Test config only

- name: test instance only - data backup snippet absent
  file:
    path: "{{ backup_data_snippet_dir }}/collectd"
    state: absent
  when: not is_prod


# Production config only

- name: production instance only - data backup snippet present
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/collectd"
    owner: root
    group: root
    mode: 0755
  when: is_prod

