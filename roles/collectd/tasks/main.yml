---

- name: collectd installed
  yum:
    name: >
      collectd,
      collectd-curl_json,
      collectd-mysql,
      collectd-nginx,
      collectd-rrdtool
    state: present

- name: state whether data is already present
  command: test -d "{{ collectd_instance_data_path }}"
  check_mode: no
  register: collectd_data_already_present
  failed_when: collectd_data_already_present.rc > 1

- name: collected data backup available
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/collectd-data.tgz"
    dest: "/tmp/collectd-data.tgz"
    mode: get
  when: collectd_data_already_present.rc == 1

- name: collected data backup deployed
  unarchive:
    src: /tmp/collectd-data.tgz
    dest: /var/lib
    remote_src: yes
  when: collectd_data_already_present.rc == 1

- name: collectd base configured
  lineinfile:
    path: /etc/collectd.conf
    regexp: '^#?{{ item.key }}.*'
    line: "{{ item.key }} {{ item.value }}"
  with_items:
    - { key: "Hostname",                value: '"{{ main_domain_name }}"' }
    - { key: "BaseDir",                 value: '"/var/lib/collectd"' }
    - { key: "PIDFile",                 value: '"/var/run/collectd.pid"' }
    - { key: "PluginDir",               value: '"/usr/lib64/collectd"' }
    - { key: "TypesDB",                 value: '"/usr/share/collectd/types.db"' }
    - { key: "AutoLoadPlugin",          value: 'false' }
    - { key: "CollectInternalStats",    value: 'false' }
    - { key: "Interval",                value: '30' }
    - { key: "MaxReadInterval",         value: '86400' }
    - { key: "Timeout",                 value: '2' }
    - { key: "ReadThreads",             value: '5' }
    - { key: "WriteThreads",            value: '5' }
    - { key: "WriteQueueLimitHigh",     value: '1000000' }
    - { key: "WriteQueueLimitLow",      value: '800000' }
  notify:
    - restart collectd

- name: collectd base plugins configured
  lineinfile:
    path: /etc/collectd.conf
    regexp: '^#?{{ item.key }}\s+{{ item.value }}$'
    line: "{{ item.key }} {{ item.value }}"
  with_items:
    - { key: "LoadPlugin",  value: 'syslog' }
    - { key: "#LoadPlugin", value: 'logfile' }
    - { key: "LoadPlugin",  value: 'cpu' }
    - { key: "LoadPlugin",  value: 'interface' }
    - { key: "LoadPlugin",  value: 'load' }
    - { key: "LoadPlugin",  value: 'memory' }
    - { key: "Include",     value: '"/etc/collectd.d"' }
  notify:
    - restart collectd

- name: collectd additional base plugins configured
  template:
    src: "{{ item }}.conf.j2"
    dest: /etc/collectd.d/{{ item }}.conf
    owner: root
    group: root
    mode: 0644
  with_items:
    - df
    - unixsock
  notify:
    - restart collectd

- name: collectd SQL account created
  mysql_user:
    name: "{{ collectd_sql_user }}"
    host: 'localhost'
    password: "{{ collectd_sql_password }}"
    priv: '{{ mysql_ps_db_name }}.*:SELECT'
    state: present

- name: state whether CGP is already present
  command: test -d "{{ monitoring_path }}"
  check_mode: no
  register: cgp_already_present
  failed_when: cgp_already_present.rc > 1

- name: CGP directory created
  file:
    path: "{{ monitoring_path }}"
    state: directory
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0755

- name: CGP files installed
  unarchive:
    remote_src: yes
    src: "https://github.com/pommi/CGP/archive/v1.tar.gz"
    dest: "{{ monitoring_path }}"
    extra_opts: [--strip-components=1]
  when: cgp_already_present.rc == 1

- name: files and directories owner/group set
  file:
    path: "{{ monitoring_path }}"
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0644
    state: directory
    recurse: yes

- name: CGP configured
  template:
    src: cgp-config.local.php.j2
    dest: "{{ monitoring_path }}/conf/config.local.php"
    owner: "{{ www_owner }}"
    group: "{{ www_group }}"
    mode: 0644

- name: directories permissions set
  command: find "{{ monitoring_path }}" -type d -exec chmod 0755 {} +

- name: /monitoring nginx access configured
  template:
    src: vhost-nginx.j2
    dest: /etc/nginx/conf.d/admin.conf-monitoring
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: collectd started and enabled at boot
  service:
    name: collectd
    state: started
    enabled: yes


# Test config only

- name: test instance only - data backup snippet absent
  file:
    path: "{{ backup_data_snippet_dir }}/collectd"
    state: absent
  when: not is_prod


# Production config only

- name: production instance only - data backup snippet present
  template:
    src: backup-instance.sh.j2
    dest: "{{ backup_data_snippet_dir }}/collectd"
    owner: root
    group: root
    mode: 0755
  when: is_prod

