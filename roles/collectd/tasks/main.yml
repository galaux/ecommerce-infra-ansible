---

- name: install collectd
  yum:
    name: >
      collectd,
      collectd-curl_json,
      collectd-mysql,
      collectd-nginx,
      collectd-rrdtool
    state: present

- name: stat whether data is already present
  command: test -d "/var/lib/collectd/rrd/{{ main_domain_name }}"
  check_mode: no
  register: collectd_data_already_present
  failed_when: collectd_data_already_present.rc > 1

- name: retrieve previously collected data
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/collectd-data.tgz"
    dest: "/tmp/collectd-data.tgz"
    mode: get
  when: collectd_data_already_present.rc == 1

- name: extract previously collected data
  unarchive:
    src: /tmp/collectd-data.tgz
    dest: /var/lib
    remote_src: yes
  when: collectd_data_already_present.rc == 1

- name: setup collectd
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

- name: setup collectd snippets
  template:
    src: "{{ item }}.conf.j2"
    dest: /etc/collectd.d/{{ item }}.conf
    owner: root
    group: root
    mode: 0644
  with_items:
    - df
    - php-fpm
    - nginx
    - mysql
    - processes
  notify:
    - restart collectd

- name: append specific php-fpm types
  lineinfile:
    path: /usr/share/collectd/types.db
    regexp: "^{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  with_items:
    - { key: "phpfpm_listen_queue",  value: "value:GAUGE:0:65535" }
    - { key: "phpfpm_processes",     value: "value:GAUGE:0:65535" }
    - { key: "phpfpm_requests",      value: "value:DERIVE:0:U"    }
    - { key: "phpfpm_slow_requests", value: "value:DERIVE:0:U"    }
  notify:
    - restart collectd

- name: stat whether CGP is already present
  command: test -d "{{ monitoring_path }}"
  check_mode: no
  register: cgp_already_present
  failed_when: cgp_already_present.rc > 1

- name: create CGP directory
  file:
    path: "{{ monitoring_path }}"
    state: directory
    owner: apache
    group: apache
    mode: 0755

- name: install CGP
  unarchive:
    remote_src: yes
    src: "https://github.com/pommi/CGP/archive/v1.tar.gz"
    dest: "{{ monitoring_path }}"
    extra_opts: [--strip-components=1]
    owner: apache
    group: apache
    mode: 0755
  when: cgp_already_present.rc == 1

- name: set files and directories owner/group
  file:
    path: "{{ monitoring_path }}"
    owner: apache
    group: apache
    mode: 0644
    state: directory
    recurse: yes

- name: configure CGP
  lineinfile:
    path: "{{ monitoring_path }}/conf/config.php"
    regexp: "^\\$CONFIG\\['{{ item.key }}'\\]"
    line: "$CONFIG['{{ item.key }}'] = {{ item.value }};"
  with_items:
    - { key: "graph_smooth", value: "true" }

- name: set directories permissions
  command: find "{{ monitoring_path }}" -type d -exec chmod 0755 {} +

- name: configure '/monitoring' nginx access
  template:
    src: vhost-nginx.j2
    dest: /etc/nginx/conf.d/admin.conf-monitoring
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: enable collectd
  service:
    name: collectd
    state: started
    enabled: yes
