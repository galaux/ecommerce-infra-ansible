---

- name: install collectd
  yum: >
    name=collectd,collectd-rrdtool,collectd-nginx,collectd-mysql
    state=present

- name: setup collectd
  template: >
   src=collectd.conf.j2
   dest=/etc/collectd.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart collectd

- name: setup collectd snippets
  template: >
   src={{ item }}.conf.j2
   dest=/etc/collectd.d/{{ item }}.conf
   owner=root
   group=root
   mode=0644
  with_items:
    - df
    - nginx
    - mysql
    - processes
  notify:
    - restart collectd

- name: create CGP directory
  file:
    path: "{{ monitoring_path }}"
    state: directory
    owner: apache
    group: apache
    mode: 0755

- name: install CGP
  unarchive:
    remote_src: yes
    src: "https://github.com/pommi/CGP/archive/v1.tar.gz"
    dest: "{{ monitoring_path }}"
    extra_opts: [--strip-components=1]
    owner: apache
    group: apache
    mode: 0755

- name: set files permissions
  command: find "{{ monitoring_path }}" -type d -exec chmod 0755 {} \;

- name: set directories permissions
  command: find "{{ monitoring_path }}" -type f -exec chmod 0644 {} \;

- name: configure '/monitoring' nginx access
  template: >
   src=nginx-admin.conf.j2
   dest=/etc/nginx/conf.d/admin.conf
   owner=root
   group=root
   mode=0644
  notify:
    - restart nginx

- name: enable collectd
  service: >
    name=collectd
    enabled=yes
