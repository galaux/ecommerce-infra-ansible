---

- name: install collectd
  yum:
    name: >
      collectd,
      collectd-mysql,
      collectd-nginx,
      collectd-rrdtool
    state: present

- name: stat whether data is already present
  command: test -d "/var/lib/collectd/rrd/{{ fqdn }}"
  check_mode: no
  register: collectd_data_already_present
  failed_when: collectd_data_already_present.rc > 1

- name: retrieve previously collected data
  aws_s3:
    bucket: "{{ prestashop_backup_bucket }}"
    object: "/{{ backup_date }}/collectd-data.tgz"
    dest: "/tmp/collectd-data.tgz"
    mode: get
  when: collectd_data_already_present.rc == 1

- name: extract previously collected data
  unarchive:
    src: /tmp/collectd-data.tgz
    dest: /var/lib
    remote_src: yes
  when: collectd_data_already_present.rc == 1

- name: setup collectd
  template:
    src: collectd.conf.j2
    dest: /etc/collectd.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart collectd

- name: setup collectd snippets
  template:
    src: "{{ item }}.conf.j2"
    dest: /etc/collectd.d/{{ item }}.conf
    owner: root
    group: root
    mode: 0644
  with_items:
    - df
    - nginx
    - mysql
    - processes
  notify:
    - restart collectd

- name: create CGP directory
  file:
    path: "{{ monitoring_path }}"
    state: directory
    owner: apache
    group: apache
    mode: 0755

- name: install CGP
  unarchive:
    remote_src: yes
    src: "https://github.com/pommi/CGP/archive/v1.tar.gz"
    dest: "{{ monitoring_path }}"
    extra_opts: [--strip-components=1]
    owner: apache
    group: apache
    mode: 0755

- name: set files and directories owner/group
  file:
    path: "{{ monitoring_path }}"
    owner: apache
    group: apache
    mode: 0644
    state: directory
    recurse: yes

- name: set directories permissions
  command: find "{{ monitoring_path }}" -type d -exec chmod 0755 {} \;

- name: configure '/monitoring' nginx access
  template:
    src: vhost-nginx.j2
    dest: /etc/nginx/conf.d/admin.conf-monitoring
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx

- name: enable collectd
  service:
    name: collectd
    state: started
    enabled: yes
