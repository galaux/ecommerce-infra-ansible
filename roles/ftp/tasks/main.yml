---

- name: vsftpd installed
  yum:
    name: vsftpd
    state: present

- name: vsftpd config file installed
  lineinfile:
    path: /etc/vsftpd/vsftpd.conf
    regexp: "^#?{{ item.name }}="
    line: "{{ item.name }}={{ item.value }}"
  with_items:
    - { name: "anonymous_enable", value: "NO" }
    - { name: "chown_uploads", value: "YES" }
    - { name: "chown_username", value: "apache" }
    - { name: "listen", value: "YES" }
    - { name: "listen_ipv6", value: "NO" }
    - { name: "pasv_enable", value: "NO" }
  notify:
    - restart vsftpd

- name: Read only Unix user created
  user:
    name: "{{ ro_user }}"
    group: apache
    # https://gist.github.com/douglasmiranda/f21a4481d372ae54fcf4a6ff32249949#trying-to-apply-some-jinja2-pipeline-functionsfilters-to-encrypted-inline-var-ansible-vault
    password: "{{ '%s' | format(ro_password) | password_hash('sha512') }}"
    createhome: no
    home: "{{ www_path }}"
    # Same password will have different hashes every time this is run so let's
    # ensure we only update it when creating the user.
    update_password: on_create

- name: vsftpd stopped and disabled at boot
  service:
    name: vsftpd
    state: stopped
    enabled: no
