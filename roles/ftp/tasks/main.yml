---

- name: vsftpd installed
  yum:
    name: vsftpd
    state: present

- name: vsftpd config file installed
  lineinfile:
    path: /etc/vsftpd/vsftpd.conf
    regexp: "^#?{{ item.name }}="
    line: "{{ item.name }}={{ item.value }}"
  with_items:
    - { name: "anonymous_enable", value: "NO" }
    - { name: "chown_uploads", value: "YES" }
    - { name: "chown_username", value: "apache" }
    - { name: "listen", value: "YES" }
    - { name: "listen_ipv6", value: "NO" }
    - { name: "pasv_enable", value: "NO" }
  notify:
    - restart vsftpd

- name: Read only Unix user created
  user:
    name: "{{ ro_user }}"
    group: apache
    password: '{{ ro_password_hash }}'
    createhome: no
    home: "{{ www_path }}"

- name: vsftpd stopped and disabled at boot
  service:
    name: vsftpd
    state: stopped
    enabled: no
