---

- name: setup test instance
  hosts: test.example.com
  become: true
  become_user: root
  roles:
    - { role: ansible-dependencies }
    - { role: etc-hosts }
    - { role: sshd, tags: ['sshd'] }
    - { role: logrotate }
    - { role: php }
    - { role: php-fpm }
    - { role: nginx }
    - { role: prestashop }
    - { role: mysqld }
    - { role: letsencrypt }
    - { role: collectd }
    - { role: backup-instance }
