---

- name: setup example instance
  hosts: all
  become: true
  become_user: root
  roles:
    - { role: base,              tags: ['base'] }
    - { role: sshd,              tags: ['sshd'] }
    - { role: mysqld,            tags: ['mysqld'] }
    - { role: letsencrypt,       tags: ['letsencrypt'] }
    - { role: nginx,             tags: ['nginx'] }
    - { role: php,               tags: ['php'] } # Installs httpd which creates user apache
    - { role: php-fpm,           tags: ['php-fpm'] }
    - { role: collectd,          tags: ['collectd'] } # Requires mysqld, nginx, php
    - { role: postfix,           tags: ['postfix'] }
    - { role: backup-instance,   tags: ['backup-instance'] }
    - { role: prestashop,        tags: ['prestashop'] } # Requires mysqld, nginx, php
    - { role: wordpress,         tags: ['wordpress'] } # Requires mysqld, nginx, php
    - { role: phpmyadmin,        tags: ['phpmyadmin'] } # Requires mysqld, nginx, php
    - { role: monit,             tags: ['monit'] }
    - { role: ftp,               tags: ['ftp'] }
