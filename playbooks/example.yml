---

- name: setup example instance
  hosts: all
  become: true
  become_user: root
  roles:
    - { role: base,                             tags: ['base'] }
    - { role: sshd,                             tags: ['sshd'] }
    - { role: letsencrypt,                      tags: ['letsencrypt'] }
    - { role: nginx,                            tags: ['nginx'] }
    - { role: php,                              tags: ['php'] }
    - { role: php-fpm,                          tags: ['php-fpm'] }
    - { role: prestashop,                       tags: ['prestashop'] }
    - { role: mysqld,                           tags: ['mysqld'] }
    - { role: collectd,                         tags: ['collectd'] }
    - { role: backup-instance,                  tags: ['backup-instance'] }
    - { role: phpmyadmin,                       tags: ['phpmyadmin'] }
    - { role: monit,                            tags: ['monit'] }
    - { role: ftp,                              tags: ['ftp'] }
