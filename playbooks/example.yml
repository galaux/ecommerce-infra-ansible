---

- name: setup example instance
  hosts: all
  become: true
  become_user: root
  roles:
    - { role: ansible-dependencies }
    - { role: etc-hosts }
    - { role: sshd, tags: ['sshd'] }
    - { role: logrotate }
    - { role: php }
    - { role: php-fpm }
    - { role: letsencrypt }
    - { role: nginx }
    - { role: prestashop }
    - { role: mysqld }
    - { role: collectd }
    - { role: backup-instance}
    - { role: phpmyadmin }
    - { role: monit }
