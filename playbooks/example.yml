---

- name: setup example instance
  hosts: all
  become: true
  become_user: root
  roles:
    - { role: base,              tags: ['base'] }
    - { role: sshd,              tags: ['sshd'] }
    - { role: backup-instance,   tags: ['backup-instance'] }
    - { role: monit,             tags: ['monit'] }
    - { role: collectd,          tags: ['collectd'] }
    # - { role: collectd-ui,       tags: ['collectd'] } # Requires Nginx & Co.
    - { role: postfix,           tags: ['postfix'] }

    - { role: mysqld,            tags: ['mysqld'] } # Requires monit, collectd
      # At the moment, nginx role needs role letsencrypt (because Nginx conf
      # holds SSL vhost) and letsencrypt depends on nginx because it "notifies"
      # it. To decouple these two, the Nginx files that declares the vhosts
      # (/etc/nginx/conf.d/{www,admin,blog,…}.conf) should be split: 80 conf
      # should be placed by nginx and 443 by letsencrypt.
      # FIXME decouple roles nginx and letsencrypt.
    - { role: nginx,             tags: ['nginx'] } # Requires monit, collectd, letsencrypt
    - { role: letsencrypt,       tags: ['letsencrypt'] } # Requires nginx
    - { role: php-fpm,           tags: ['php-fpm'] } # Requires nginx, monit, collectd

    - { role: prestashop,        tags: ['prestashop'] } # Requires mysqld, nginx, php
    - { role: wordpress,         tags: ['wordpress'] } # Requires mysqld, nginx, php
    - { role: phpmyadmin,        tags: ['phpmyadmin'] } # Requires mysqld, nginx, php
    - { role: ftp,               tags: ['ftp'] }
