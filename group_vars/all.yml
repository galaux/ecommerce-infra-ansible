---

production_eip: "203.0.113.10"
backup_date_latest_label: "latest_backup"
backup_date: "{{ backup_date_latest_label }}"
sub_domains:
  - admin
  - blog
  - www
domain_prefix: "test"
domain_prefix_dot: "{% if domain_prefix %}{{ domain_prefix }}.{% endif %}"
main_hosted_zone: { domain_name: "{{ domain_prefix_dot }}example.com", ps_path_prefix: "", zone_id: "Z0EXAMPLEZON02" }
alt_hosted_zones:
  - { domain_name: "{{ domain_prefix_dot }}example.fr", ps_path_prefix: "/fr",  zone_id: "Z0EXAMPLEZON01" }
hosted_zones: "{{ [main_hosted_zone] + alt_hosted_zones }}"
main_domain_name: "{{ main_hosted_zone.domain_name }}"
backup_data_snippet_dir: "/etc/backup-instance.d"
is_prod: "{% if main_domain_name == 'example.com' %}True{% else %}False{% endif %}"
ssh_port: 22
regular_user: "centos"
prestashop_version_file_name: "prestashop_version"
prestashop_backups:
  - { tarball: "classes.tgz",               relpath: "classes" }
  - { tarball: "download.tgz",              relpath: "download" }
  - { tarball: "img.tgz",                   relpath: "img" }
  - { tarball: "mails.tgz",                 relpath: "mails" }
  - { tarball: "modules.tgz",               relpath: "modules" }
  - { tarball: "themes_simple-great.tgz",   relpath: "themes/simple-great" }
  - { tarball: "themes_example.tgz", relpath: "themes/example" }
  - { tarball: "translations.tgz",          relpath: "translations" }
  - { tarball: "upload.tgz",                relpath: "upload" }
www_path: "/var/www"
prestashop_backup_bucket: "prestashop-data"
prestashop_path: "{{ www_path }}/prestashop"
wordpress_version_file_name: "wordpress_version"
wordpress_path: "{{ www_path }}/wordpress"
prestashop_admin_page_name: "FuckMyAdm1n"
monitoring_url_path: "monitoring"
phpmyadmin_url_path: "phpmyadmin"
phpmyadmin_sql_user: "phpmyadmin"
phpmyadmin_sql_password: XXXXXXXX
monitoring_path: "{{ www_path }}/{{ monitoring_url_path }}"
letsencrypt_path: "/etc/letsencrypt"
mysql_pid_path: "/var/lib/mysql/mysql.pid"
mysql_socket_path: "/var/lib/mysql/mysql.sock"
# mysql_ro_user: "shop-ro"
# mysql_ro_password: "XXXXXXXX"
mysql_ps_user: "ps_std"
mysql_ps_password: XXXXXXXX
mysql_ps_db_name: "ps_std"
mysql_root_password: XXXXXXXX
mysql_wp_user: "wp_std"
mysql_wp_password: XXXXXXXX
mysql_wp_db_name: "wp_std"
nginx_status_path: "/status-nginx"
php_fpm_pid_path: "/run/php-fpm/php-fpm.pid"
php_fpm_status_path: "/status-php-fpm"
php_fpm_socket_path: "/run/php-fpm/php-fpm.sock"
certificates_backup_name: "cert-{{ main_domain_name }}.tgz"
htpasswd_path: "/etc/nginx/htpasswd"
ro_user: "rouser"
ro_password_hash: XXXXXXXX
collectd_sql_user: "collectd"
collectd_sql_password: XXXXXXXX
collectd_socket_path: "/var/run/collectd-unixsock"
collectd_var_path: "/var/lib/collectd/rrd"
collectd_instance_data_path: "{{ collectd_var_path }}/{{ main_domain_name }}"
