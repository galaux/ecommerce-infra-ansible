---

dev:
  hosts:
    ec2-203-0-113-42.eu-central-1.compute.amazonaws.com:
      ansible_user: centos
      # ansible_port: 22
  vars:
    ssh_port: 22
    prompt_host_color: "DARK_YELLOW"
    domain_prefix: "test"
    backup_instance_at_boot: true
    update_dns_at_boot: true
    alerting_email_enabled: false
    renew_certificates: false
    renew_certificates_at_boot: true
    self_signed_certificate: false
    do_backup: false
