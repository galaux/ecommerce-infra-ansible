AWSTemplateFormatVersion: 2010-09-09
Description: example instance

Parameters:

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.nano
      - t2.micro
      - t2.small
      - t2.medium
    ConstraintDescription: must be a valid EC2 instance type.

  Branch:
    Description: Which Git branch to deploy
    Type: String
    Default: develop

  BackupDate:
    Description: Date of S3 backup to restore or "latest_backup"
    Type: String
    Default: latest_backup

  DomainPrefix:
    Description: Prefix to the domains ('[DomainPrefix].example.com') can be left empty for Production in which case PS/WP will be backed-up to S3 and DNS records will be NOT be updated
    Type: String
    Default: test
    AllowedValues:
      - ''
      - test
      - test2

  AlertingSendsEmail:
    Description: Do you want alerting to send emails when a one of its check fails (advised for production but not for test)?
    Type: String
    AllowedValues:
      - True
      - False
    Default: False

Resources:
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    DeletionPolicy: Retain
    Properties:
      InstanceType: !Ref InstanceType
      SecurityGroups:
        - example-ami
      IamInstanceProfile: example-ami
      KeyName: example-kp
      ImageId: "ami-337be65c"
      Tags:
        -
          Key: Name
          Value: !Ref DomainPrefix
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          set -e
          GITLAB_TOKEN='REDACTED700000000000'
          PROJECT_NAME='example-ansible'
          ARCHIVE_URL="https://gitlab.com/example/$PROJECT_NAME/repository/${Branch}/archive.tar.gz"
          yum --assumeyes clean all
          yum --assumeyes makecache
          yum --assumeyes install epel-release
          yum --assumeyes update
          yum \
            --assumeyes \
            install \
            wget \
            python2-boto3 \
            ansible
          cd /tmp
          wget "$ARCHIVE_URL?private_token=$GITLAB_TOKEN" \
            -O $PROJECT_NAME.tar.gz
          tar xf $PROJECT_NAME.tar.gz
          cd $PROJECT_NAME-${Branch}-*
          ansible-playbook \
            --connection=local \
            --limit=localhost \
            playbooks/example.yml \
            --extra-vars '{
                            "backup_date": "${BackupDate}",
                            "alerting_sends_email": ${AlertingSendsEmail},
                            "domain_prefix": "${DomainPrefix}"
                          }'

Outputs:

  InstanceId:
    Description: InstanceId of the newly created EC2 instance
    Value: !Ref EC2Instance

  AZ:
    Description: Availability Zone of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - AvailabilityZone

  PublicDNS:
    Description: Public DNSName of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - PublicDnsName

  PublicIP:
    Description: Public IP address of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - PublicIp
