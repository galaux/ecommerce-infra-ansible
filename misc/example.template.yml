AWSTemplateFormatVersion: 2010-09-09
Description: example instance

Parameters:

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.nano
      - t2.micro
      - t2.small
      - t2.medium
    ConstraintDescription: must be a valid EC2 instance type.

  BackupDate:
    Description: Date of S3 backup to restore or "latest_backup"
    Type: String
    Default: latest_backup

  DomainPrefix:
    Description: |
      Prefix of the domain ('[DomainPrefix].example.com').
      Leave empty for Production.
    Type: String
    Default: test
    AllowedValues:
      - ''
      - test
      - test2

Resources:
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    DeletionPolicy: Retain
    Properties:
      InstanceType: !Ref InstanceType
      SecurityGroups:
        - example-ami
      IamInstanceProfile: example-ami
      KeyName: example-kp
      ImageId: "ami-337be65c"
      Tags:
        -
          Key: Name
          Value: !Ref DomainPrefix
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          set -e
          GITLAB_TOKEN='REDACTED700000000000'
          PROJECT_ID=4742520
          ARCHIVE_URL="https://gitlab.com/api/v4/projects/${PROJECT_ID}/repository/archive.tar.gz"
          yum --assumeyes clean all
          yum --assumeyes makecache
          yum --assumeyes install epel-release
          yum --assumeyes update
          yum \
            --assumeyes \
            install \
            wget \
            python-boto3 \
            ansible
          cd /tmp
          # https://gitlab.com/gitlab-org/gitlab-foss/-/issues/19843
          wget \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${ARCHIVE_URL}" \
            -O $PROJECT_NAME.tar.gz
          tar xf $PROJECT_NAME.tar.gz
          cd $PROJECT_NAME-develop-*
          ansible-playbook \
            --connection=local \
            --limit=localhost \
            playbooks/example.yml \
            --extra-vars '{
                            "backup_date": "${BackupDate}",
                            "domain_prefix": "${DomainPrefix}"
                          }'

Outputs:

  InstanceId:
    Description: InstanceId of the newly created EC2 instance
    Value: !Ref EC2Instance

  AZ:
    Description: Availability Zone of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - AvailabilityZone

  PublicDNS:
    Description: Public DNSName of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - PublicDnsName

  PublicIP:
    Description: Public IP address of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - PublicIp
