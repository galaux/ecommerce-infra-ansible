AWSTemplateFormatVersion: 2010-09-09
Description: example instance

Mappings:
  ImageMap:
    amazon-linux:
      ImageId: "ami-bf2ba8d0"
    centos:
      ImageId: "ami-1e038d71"
    centos-up:
      ImageId: "ami-1e038d71"

Parameters:

  InstanceName:
    Description: (Optional) comprehensive name used to identify this instance
    Type: String

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.nano
      - t2.micro
      - t2.small
      - t2.medium
    ConstraintDescription: must be a valid EC2 instance type.

  LinuxFlavour:
    Description: Which Linux flavour to setup
    Type: String
    Default: amazon-linux
    AllowedValues:
      - amazon-linux
      - centos
      - centos-up

  BackupDate:
    Description: Date of backup to restore or "LATEST"
    Type: String
    Default: LATEST
    ConstraintDescription: "must be a valid S3 backup directory name (ex: '2017-12-25-023001')"

  FQDN:
    Description: Fully qualified domain name the instance should answer as
    Type: String
    Default: test.example.com
    AllowedValues:
      - example.com
      - test.example.com
    ConstraintDescription: "one of 'test.example.com' or 'example.com'"

  IsProduction:
    Description: Is this a Production instance (if 'true' then Monit sends emails and full PrestaShop S3 backups are enabled)
    Type: String
    AllowedValues:
      - true
      - false
    Default: false

Resources:
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      SecurityGroups:
        - example-ami
      IamInstanceProfile: example-ami
      KeyName: example-kp
      ImageId: !FindInMap [ImageMap, !Ref "LinuxFlavour", "ImageId"]
      Tags:
        - Key: Name
        - Value: !Ref InstanceName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          set -e
          GITLAB_TOKEN='REDACTED700000000000'
          PROJECT_NAME='example-ansible'
          case ${LinuxFlavour} in
            "amazon-linux") branch='master'; yum_param='--enablerepo=epel' ;;
            "centos")       branch='centos'; yum_param='';;
            "centos-up")    branch='centos-up'; yum_param='';;
          esac
          ARCHIVE_URL="https://gitlab.com/example/$PROJECT_NAME/repository/$branch/archive.tar.gz"
          yum --assumeyes clean all
          yum --assumeyes makecache
          yum --assumeyes update
          yum \
            --assumeyes \
            $yum_param \
            install \
            wget \
            ansible
          cd /tmp
          wget "$ARCHIVE_URL?private_token=$GITLAB_TOKEN" \
            -O $PROJECT_NAME.tar.gz
          tar xf $PROJECT_NAME.tar.gz
          cd $PROJECT_NAME-$branch-*
          ansible-playbook \
            --connection=local \
            --limit=localhost \
            playbooks/example.yml \
            --extra-vars '{
                            "with_backup_date": "${BackupDate}",
                            "fqdn": "${FQDN}",
                            "is_prod": ${IsProduction},
                            "instance_name": "${InstanceName}"
                          }'

Outputs:

  InstanceId:
    Description: InstanceId of the newly created EC2 instance
    Value: !Ref EC2Instance

  AZ:
    Description: Availability Zone of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - AvailabilityZone

  PublicDNS:
    Description: Public DNSName of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - PublicDnsName

  PublicIP:
    Description: Public IP address of the newly created EC2 instance
    Value: !GetAtt
      - EC2Instance
      - PublicIp
